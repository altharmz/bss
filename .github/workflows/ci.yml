# CI. Pull requests to master and pushes to master run the cheap gate (make lint, make
# docs-check, make test-smoke: the tests marked `smoke`); the full make test runs nightly
# and on demand. The harness job (no Docker) checks the documentation links on every run
# and the harness script tests on pull requests that change them.
# Decision: docs/decisions/harness.md, "CI".
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    # 01:30 UTC = 04:30 Moscow, outside working hours. Scheduled runs use master.
    - cron: "30 1 * * *"
  workflow_dispatch:

# A newer push to the same pull request supersedes the running check. Runs on master are
# never cancelled (every commit there keeps its own result), and a nightly or manual full
# run has its own group, so it neither waits for nor cancels a push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ../bss-task
    env:
      # the nightly and manual runs run everything; the rest runs the smoke tests only
      FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The wrapper requires a linked task worktree and an external development file.
      # Preserve the existing checks, using only a disposable CI credential.
      - name: Prepare isolated CI worktree
        working-directory: ${{ github.workspace }}
        run: |
          task="issue-${GITHUB_RUN_ID}-ci-${GITHUB_RUN_ATTEMPT}"
          git worktree add -b "$task" ../bss-task HEAD
          mkdir -p ../bss-task/.task "$HOME/.config/bss/tasks/$task"
          printf '{"version":1,"task_id":"%s","app_port":21000,"mcp_port":21001,"web_port":21002}\n' "$task" > ../bss-task/.task/runtime.json
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          (umask 077; printf 'POSTGRES_PASSWORD=%s\n' "$password" > "$HOME/.config/bss/tasks/$task/.env")
          echo "BSS_CI_TASK=$task" >> "$GITHUB_ENV"

      # The dev image make lint / make test run in (compose.override.yaml: target dev,
      # task-specific image). Built here with a layer cache so pinned dependency layers are
      # not reinstalled on every run; compose then finds the image and does not build.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}/../bss-task
          target: dev
          tags: bss-${{ env.BSS_CI_TASK }}-app:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: make lint
      - run: make docs-check
      - run: make test-smoke
        if: env.FULL != 'true'
      - run: make test
        if: env.FULL == 'true'

  # Backstop for the local commit hook: no Docker, needs only make, git and Python.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A few seconds: every relative link and the commands the docs name must exist.
      - run: make docs-links

      # About 100 s, so only when the harness itself changed (the nightly full run covers
      # it through make test).
      - name: Detect harness changes
        id: harness
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(scripts/|\.claude/|\.codex/|Makefile$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: make runtime-check
        if: steps.harness.outputs.changed == 'true'
