# CI. Pull requests to master and pushes to master run the cheap gate (make lint, make
# docs-check, make test-smoke: the tests marked `smoke`); the full make test runs nightly
# and on demand. Decision: docs/decisions/harness.md, "CI".
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    # 01:30 UTC = 04:30 Moscow, outside working hours. Scheduled runs use master.
    - cron: "30 1 * * *"
  workflow_dispatch:

# A newer push to the same pull request supersedes the running check. Runs on master are
# never cancelled (every commit there keeps its own result), and a nightly or manual full
# run has its own group, so it neither waits for nor cancels a push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # the nightly and manual runs run everything; the rest runs the smoke tests only
      FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # compose requires POSTGRES_PASSWORD (it is in .env locally, which is not committed).
      # A throwaway value for this run's own postgres container: nothing real is involved.
      - name: Generate the test-only database password
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          echo "POSTGRES_PASSWORD=${password}" >> "$GITHUB_ENV"

      # The dev image make lint / make test run in (compose.override.yaml: target dev,
      # bss-app:dev). Built here with a layer cache so the pinned dependency layers are
      # not reinstalled on every run; compose then finds the image and does not build.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          tags: bss-app:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: make lint
      - run: make docs-check
      - run: make test-smoke
        if: env.FULL != 'true'
      - run: make test
        if: env.FULL == 'true'
