# CI. Pull requests to master run the cheap gate (make lint, make docs-check, make
# test-smoke: the tests marked `smoke`) when they change something it can depend on (not
# for a docs-only or harness-only pull request); the full make test runs nightly and on demand.
# The harness job (no Docker) checks the documentation links on every run and the harness
# script tests on pull requests that change them. A push to master starts no run:
# `make merge-task` merges only a green pull request that is not behind master, so that
# run tested the same code a second time (#366). A failed nightly run opens an issue
# (nightly-report). Decision: docs/decisions/harness.md, "CI".
name: CI

on:
  pull_request:
    branches: [master]
  schedule:
    # 01:30 UTC = 04:30 Moscow, outside working hours. Scheduled runs use master.
    - cron: "30 1 * * *"
  workflow_dispatch:

# A newer push to the same pull request supersedes the running check. A nightly or manual
# full run is never cancelled and has its own group, so it neither waits for nor cancels a
# pull request's run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ../bss-task
    env:
      # the nightly and manual runs run everything; the rest runs the smoke tests only
      FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A pull request that changes only what no backend test, lint or generated doc
      # depends on (the harness, the docs, the UI: scripts/hook_selection.py ci-check, the
      # rule of the commit hook) skips every step below: the job ends green in seconds.
      # A step here and not a job of its own: every job is billed as a whole minute.
      - name: Decide whether this run can affect the checks
        id: scope
        working-directory: ${{ github.workspace }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          git diff --name-only "$BASE" HEAD | python3 -B scripts/hook_selection.py ci-check >> "$GITHUB_OUTPUT"

      # The wrapper requires a linked task worktree and an external development file.
      # Preserve the existing checks, using only a disposable CI credential.
      - name: Prepare isolated CI worktree
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          task="issue-${GITHUB_RUN_ID}-ci-${GITHUB_RUN_ATTEMPT}"
          git worktree add -b "$task" ../bss-task HEAD
          mkdir -p ../bss-task/.task "$HOME/.config/bss/tasks/$task"
          printf '{"version":1,"task_id":"%s","app_port":21000,"mcp_port":21001,"web_port":21002}\n' "$task" > ../bss-task/.task/runtime.json
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          (umask 077; printf 'POSTGRES_PASSWORD=%s\n' "$password" > "$HOME/.config/bss/tasks/$task/.env")
          echo "BSS_CI_TASK=$task" >> "$GITHUB_ENV"

      # The dev image make lint / make test run in (compose.override.yaml: target dev,
      # task-specific image). Built here with a layer cache so pinned dependency layers are
      # not reinstalled on every run; compose then finds the image and does not build.
      # A pull request's run reads the caches of its own branch and of master, and master's
      # is written by the nightly run (no run on a push to master any more).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.run == 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.scope.outputs.run == 'true'
        with:
          context: ${{ github.workspace }}/../bss-task
          target: dev
          tags: bss-${{ env.BSS_CI_TASK }}-app:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: make lint
        if: steps.scope.outputs.run == 'true'
      - run: make docs-check
        if: steps.scope.outputs.run == 'true'
      - run: make test-smoke
        if: steps.scope.outputs.run == 'true' && env.FULL != 'true'
      - run: make test
        if: steps.scope.outputs.run == 'true' && env.FULL == 'true'

  # Backstop for the local commit hook: no Docker, needs only make, git and Python.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A few seconds: every relative link and the commands the docs name must exist.
      - run: make docs-links

      # A few minutes, so only when the harness itself changed (the nightly full run covers
      # it through make test).
      - name: Detect harness changes
        id: harness
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(scripts/|\.claude/|\.codex/|\.github/workflows/|Makefile$|compose\.prod\.yaml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: make runtime-check
        if: steps.harness.outputs.changed == 'true'
      - run: make deploy-check
        if: steps.harness.outputs.changed == 'true'
      # The shell cases of the hook's own scripts (part of make test-smoke until #369).
      - run: make hook-cases
        if: steps.harness.outputs.changed == 'true'

  # A failed nightly run opens an issue, or comments on the one still open, so a red master
  # is not found by chance. The only job that may write, and only issues; it checks out
  # nothing and runs no code from the repository. The issue lands in the board's Inbox like
  # any new issue.
  nightly-report:
    if: github.event_name == 'schedule' && failure()
    needs: [check, harness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      # gh run list (the last green nightly run) and the compare API (the commits since)
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CHECK: ${{ needs.check.result }}
      HARNESS: ${{ needs.harness.result }}
    steps:
      - name: Open or update the nightly failure issue
        run: |
          set -euo pipefail
          failed=""
          [[ "$CHECK" == success ]] || failed+="- \`check\` (lint, generated docs, full suite): ${CHECK}"$'\n'
          [[ "$HARNESS" == success ]] || failed+="- \`harness\` (documentation links): ${HARNESS}"$'\n'

          # The commits merged since the last green nightly run, in a code block: a commit
          # subject must not mention a person or link an issue from here.
          last="$(gh run list --workflow ci.yml --event schedule --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')"
          if [[ -z "$last" ]]; then
            commits="(no successful nightly run found)"
          elif [[ "$last" == "$GITHUB_SHA" ]]; then
            commits="(none: the last successful nightly run was on this commit)"
          else
            commits="$(gh api "repos/${GH_REPO}/compare/${last}...${GITHUB_SHA}" \
              --jq '.commits[] | .sha[0:7] + " " + (.commit.message | split("\n")[0])')" ||
              commits="(the compare request for ${last}...${GITHUB_SHA} failed)"
          fi

          body="$(printf 'The nightly CI run failed on `%s`: %s\n\nJobs that did not succeed:\n%s\nCommits since the last successful nightly run:\n\n```\n%s\n```\n' \
            "${GITHUB_SHA:0:7}" "$RUN_URL" "$failed" "$commits")"

          existing="$(gh issue list --state open --search 'in:title "Nightly CI failed:"' \
            --json number,title \
            --jq '[.[] | select(.title | startswith("Nightly CI failed:"))][0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Nightly CI failed: $(date -u +%F)" --label bug \
              --body "$body"
          fi
