# Supply-chain scanning: known vulnerabilities in the Python packages (pip-audit), the UI
# packages (npm audit) and the runtime image (Trivy). Each job fails on a finding that is not
# accepted; accepted findings expire (ops/security/audit-ignore.txt, .trivyignore). Runs on
# pull requests that change dependencies, nightly after CI and on demand. Not a required
# check: a red nightly run is the signal for a new vulnerability.
# Decision: docs/decisions/harness.md, "Supply-chain scanning".
name: Security

on:
  pull_request:
    branches: [master]
    paths:
      - "requirements*.txt"
      - "constraints*.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "Dockerfile"
      - ".trivyignore"
      - "ops/security/**"
      - "scripts/audit_gate.py"
      - ".github/workflows/security.yml"
  schedule:
    # 01:45 UTC, after the nightly CI run (01:30). Scheduled runs use master.
    - cron: "45 1 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The default bash shell has no pipefail, so a pipeline's status is the gate's: a crashed
# audit tool leaves the gate without valid JSON, and the gate then exits 2.
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-security.txt
      - name: pip-audit
        run: >
          pip-audit --strict --no-deps --disable-pip -r constraints.txt -r constraints-dev.txt --format json
          | python -B scripts/audit_gate.py --tool pip

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads only the lockfile, no install. Node runs only in the pinned image
      # (compose.override.yaml). The gate reads the dev flags from the lockfile.
      - name: npm audit
        run: >
          docker run --rm -v "$PWD/frontend:/web:ro" -w /web
          node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          npm audit --json
          | python3 -B scripts/audit_gate.py --tool npm --lockfile frontend/package-lock.json

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image production runs. Reads CI's layer cache and writes its own scope, so it
      # does not replace the cache of CI's dev image.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: bss-app:scan
          load: true
          cache-from: |
            type=gha
            type=gha,scope=security-runtime
          cache-to: type=gha,scope=security-runtime,mode=max
      # Trivy's official image pinned by digest (no third-party action).
      - name: Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore:/.trivyignore:ro"
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore bss-app:scan
