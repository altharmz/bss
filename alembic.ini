[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# No sqlalchemy.url here on purpose: this project's convention (see app/config.py) is
# that all configuration comes from environment variables, never config files.
# alembic/env.py reads DATABASE_URL directly at run time.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
