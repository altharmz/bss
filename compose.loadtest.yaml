# The local load-test stack (#281-#289, docs/loadtest.md). Applied only by
# `scripts/task-compose --loadtest` (make loadtest-*), on top of compose.yaml and
# compose.override.yaml. Its services have their own names and their own database volume,
# so the dev stack, `make test` and the pre-commit hook (which use `db`) never touch it,
# and it never touches them. No host ports: k6 (#281) reaches lt-app on the `lab` network.
#
# The system under test (lt-db, lt-app, lt-worker, lt-mcp) shares one cpuset,
# LOADTEST_SUT_CPUS (4 logical CPUs, emulating a 4-core host; default 4-7 = cores 2 and 3
# of the workstation). k6 and the metrics scraper get LOADTEST_K6_CPUS (#281; default 8-9
# = core 4, not overlapping). Limits are the load-test budget from the programme's shared
# facts; the LOADTEST_* limit variables exist for the prod-shaped scenario (today's
# production limits, set by loadtest/run.py). All services are in the `loadtest` profile,
# so a plain `up` never starts them.
services:
  lt-db:
    image: postgres:16-alpine
    profiles: [loadtest]
    # Production-like durability (fsync on), unlike the test database `db`. Settings of the
    # load-test profile: 80 connections, 1 GB shared buffers, pg_stat_statements. The
    # programme's 2 GB of shared buffers did not fit the 3g limit with 60 app connections:
    # 2.0 GB of shared memory and 0.9 GB of backends left nothing for the page cache, and
    # the kernel killed a backend twice in the 30-minute steady run (#281,
    # docs/loadtest-results.md).
    command:
      - postgres
      - -c
      - max_connections=80
      - -c
      - shared_buffers=${LOADTEST_DB_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${LOADTEST_DB_CACHE:-2GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.max=10000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    cpuset: ${LOADTEST_SUT_CPUS:-4-7}
    mem_limit: ${LOADTEST_DB_MEM:-3g}
    memswap_limit: ${LOADTEST_DB_MEM:-3g}
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' -tAq >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      - lt_pgdata:/var/lib/postgresql/data
    networks: [lab]

  lt-app:
    build:
      context: .
      target: runtime
    image: ${IMAGE_NAME:?use scripts/task-compose}:loadtest
    profiles: [loadtest]
    environment: &lt-env
      APP_ENV: test
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@lt-db:5432/${POSTGRES_DB:-app}
      BILL_PAYMENT_TERM_DAYS: "30"
      BSS_SERVICE_SECRET: ${BSS_SERVICE_SECRET:-}
      BSS_BUILD: loadtest
      # #281: k6 sends each virtual operator's own X-Forwarded-For, as Caddy does in
      # production, so the sign-in throttle (20 a minute per address) sees operators, not
      # the one k6 container; the scraper's bearer token, made per run by loadtest/run.py
      APP_TRUST_FORWARDED: "true"
      BSS_METRICS_TOKEN: ${LOADTEST_METRICS_TOKEN:-}
      # the load-test budget (#288): 4 x 15 + worker + tools <= max_connections 80
      WEB_CONCURRENCY: ${LOADTEST_WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: ${LOADTEST_DB_POOL_SIZE:-15}
      # requests in flight per process (#341); empty = DB_POOL_SIZE
      BSS_MAX_IN_FLIGHT: ${LOADTEST_MAX_IN_FLIGHT:-}
    cpuset: ${LOADTEST_SUT_CPUS:-4-7}
    cpus: ${LOADTEST_APP_CPUS:-3.0}
    mem_limit: ${LOADTEST_APP_MEM:-1536m}
    memswap_limit: ${LOADTEST_APP_MEM:-1536m}
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      lt-db:
        condition: service_healthy
    networks: [lab]

  lt-worker:
    image: ${IMAGE_NAME:?use scripts/task-compose}:loadtest
    profiles: [loadtest]
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 60s
    environment:
      <<: *lt-env
      # the billing-run measurement (#283, make loadtest-billing-run): the worker's clock
      # pinned to the run's start (APP_ENV=test only); empty = the real clock
      WORKER_FAKE_NOW: ${LOADTEST_WORKER_FAKE_NOW:-}
      # the stub network's usage feed (#281): records/s, daily average, shaped; 0 = off
      BSS_STUB_USAGE_RATE: ${LOADTEST_STUB_USAGE_RATE:-0}
      # the hour of the daily shape the feed keeps (20 = the peak, 4 = the night); -1 = the clock
      BSS_STUB_USAGE_HOUR: ${LOADTEST_STUB_USAGE_HOUR:--1}
    cpuset: ${LOADTEST_SUT_CPUS:-4-7}
    cpus: ${LOADTEST_WORKER_CPUS:-3.0}
    mem_limit: 1024m
    memswap_limit: 1024m
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "bash", "-c", "[[ -n $$(find /tmp/worker-alive -mmin -3 2>/dev/null) ]]"]
      interval: 60s
      timeout: 3s
      start_period: 30s
      start_interval: 2s
      retries: 3
    depends_on:
      lt-app:
        condition: service_healthy
    networks: [lab]

  lt-mcp:
    image: ${IMAGE_NAME:?use scripts/task-compose}:loadtest
    profiles: [loadtest]
    command: ["uvicorn", "bss_mcp.main:app", "--host", "0.0.0.0", "--port", "8080",
              "--workers", "1", "--limit-concurrency", "32"]
    environment:
      APP_ENV: test
      LOG_LEVEL: info
      BSS_API_URL: http://lt-app:8080
      # the OAuth issuer must be HTTPS or localhost; k6 uses the service credential, not OAuth
      MCP_PUBLIC_URL: http://localhost:8080
      MCP_STORE: /data/mcp.db
      BSS_SERVICE_SECRET: ${BSS_SERVICE_SECRET:-}
    cpuset: ${LOADTEST_SUT_CPUS:-4-7}
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - lt_mcp_data:/data
    depends_on:
      lt-app:
        condition: service_healthy
    networks: [lab]

  # One-off tooling against lt-db: migrations, the dataset generator (python -m
  # loadtest.seed) and the pg_stat_statements helpers. The dev image with the sources
  # mounted read-only (the runtime image has no tests/ or loadtest/); only loadtest/out/ is
  # writable. Not pinned: it is not part of the system under test.
  lt-tools:
    image: ${IMAGE_NAME:?use scripts/task-compose}:${TAG:-dev}
    profiles: [loadtest]
    command: ["python", "-c", "print('lt-tools: run a command')"]
    environment:
      <<: *lt-env
      LOG_LEVEL: warning
      LOADTEST_OPERATOR_PASSWORD: ${LOADTEST_OPERATOR_PASSWORD:-}
    healthcheck:
      disable: true
    volumes:
      - ./app:/app/app:ro
      - ./bss_mcp:/app/bss_mcp:ro
      - ./tests:/app/tests:ro
      - ./loadtest:/app/loadtest:ro
      - ./loadtest/out:/app/loadtest/out
      - ./spec:/app/spec:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    depends_on:
      lt-db:
        condition: service_healthy
    networks: [lab]

  # k6 (#281, loadtest/k6/, run by loadtest/run.py): the official image pinned by digest
  # (Grafana's GHCR copy: Docker Hub refused the daemon's pulls), on its own cpuset with a
  # 2g limit, a 2 vCPU load generator. Plain HTTP to lt-app and lt-mcp on `lab`.
  lt-k6:
    image: ghcr.io/grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    profiles: [loadtest]
    # the host user, so the run's files in loadtest/out/ stay the operator's (run.py sets it)
    user: ${LOADTEST_UID:-1000}:${LOADTEST_GID:-1000}
    cpuset: ${LOADTEST_K6_CPUS:-8-9}
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      LOADTEST_OPERATOR_PASSWORD: ${LOADTEST_OPERATOR_PASSWORD:-}
      LOADTEST_MCP_TOKENS: ${LOADTEST_MCP_TOKENS:-}
    volumes:
      - ./loadtest/k6:/scripts:ro
      - ./loadtest/out:/out
    networks: [lab]

  # Scrapes lt-app's /metrics every 15 s into the run's directory (loadtest/scrape.py).
  # On the k6 cpuset: the observer is not part of the system under test.
  lt-scrape:
    image: ${IMAGE_NAME:?use scripts/task-compose}:${TAG:-dev}
    profiles: [loadtest]
    cpuset: ${LOADTEST_K6_CPUS:-8-9}
    mem_limit: 256m
    environment:
      LOADTEST_METRICS_TOKEN: ${LOADTEST_METRICS_TOKEN:-}
    healthcheck:
      disable: true
    volumes:
      - ./loadtest:/app/loadtest:ro
      - ./loadtest/out:/app/loadtest/out
    networks: [lab]

volumes:
  lt_pgdata:
  lt_mcp_data:
