# Local development only. Auto-loaded by `docker compose` in this directory.
# Never shipped to the VPS.
services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug

  db:
    ports:
      - "127.0.0.1:5432:5432"
