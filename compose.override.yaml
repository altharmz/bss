# Local development only. Auto-loaded by `docker compose` in this directory.
# Never shipped to the VPS. Local dev runs its own postgres on the `lab` network; the
# shared infrastructure from vps-infra is never needed (or started) for development.
services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - ./app:/app/app:ro
      - ./bss_mcp:/app/bss_mcp:ro
      - ./tests:/app/tests:ro
      # read by tests/test_mcp_tools.py: the MCP tools = the API
      # operations minus scope.yaml's api exclusions (drift check)
      - ./docs/progress/scope.yaml:/app/docs/progress/scope.yaml:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      # TMF specs: read by the app (app/api/specschema.py; the runtime image copies them)
      # and by the tests (tests/contract.py, tests/test_enum_lock.py).
      - ./spec:/app/spec:ro
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-app}
      # the mcp service's credential (empty: it never authenticates; make mcp-smoke then
      # skips its prepaid part). Same value for app and mcp, set in .env.
      BSS_SERVICE_SECRET: ${BSS_SERVICE_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [lab]

  # Writable twin of `app` for code-mutating tooling (make fmt, .claude/hooks/format.sh).
  # `app` keeps its read-only source mounts. Same dev image, so the same ruff version.
  # Only the code ruff may rewrite is mounted (at /app, where `app` sees its sources) - not
  # the whole project, so the container never sees .env, .env.prod, .git, .claude or the
  # compose files. A .py elsewhere is not formatted; the format hook reports that instead
  # of passing silently. The venv lives in /opt/venv. Only started explicitly:
  # docker compose run tools ...
  tools:
    build:
      context: .
      target: dev
    image: ${IMAGE_NAME:-bss-app}:${TAG:-dev}
    profiles: [tools]
    volumes:
      - ./app:/app/app
      - ./bss_mcp:/app/bss_mcp
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./pyproject.toml:/app/pyproject.toml:ro
    network_mode: none
    command: ["ruff", "--version"]

  # The MCP connector (bss_mcp/, docs/mcp.md): the same dev image in its own process.
  # Reaches the app over HTTP only (BSS_API_URL), never the database: no DATABASE_URL.
  # OAuth clients and tokens live in SQLite on the mcp_data volume, not in the bss
  # database; losing it only means re-authorizing. Listens on 8080 inside, like the app,
  # so the image's /healthz probe applies unchanged; published on host port 8090.
  # Refuses to start unless BSS_API_URL answers as bss (startup identity check).
  mcp:
    build:
      context: .
      target: dev
    image: ${IMAGE_NAME:-bss-app}:${TAG:-dev}
    command: ["uvicorn", "bss_mcp.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    volumes:
      - ./app:/app/app:ro
      - ./bss_mcp:/app/bss_mcp:ro
      - ./spec:/app/spec:ro
      - mcp_data:/data
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug
      BSS_API_URL: http://app:8080
      MCP_PUBLIC_URL: http://localhost:8090
      MCP_STORE: /data/mcp.db
      # name:<scrypt hash>[,name:<hash>] - the OAuth login (slice 2); in .env, never committed
      MCP_USERS: ${MCP_USERS:-}
      BSS_SERVICE_SECRET: ${BSS_SERVICE_SECRET:-}
    depends_on:
      app:
        condition: service_healthy
    networks: [lab]

  # Node toolchain for the admin UI (frontend/). Node never runs on the host: every npm
  # command goes through this service (make web-*). Only frontend/ is mounted, plus spec/
  # read-only for type generation - the container never sees .env, .git or .claude.
  # node_modules and the npm cache are named volumes; the image creates their mount points
  # owned by `node` (uid 1000 = the WSL user), so a new volume starts out writable and the
  # host's frontend/ never gets a node_modules. The base image is pinned by digest.
  # `web` has network: `make web-dev` (Vite, proxying /tmf-api and /internal to `app`) and
  # `make web-install` (npm ci, the only download). `web-offline` has none
  # (network_mode: none) and runs build, lint, test, types and fmt, which therefore can
  # never fetch anything.
  web:
    build: &web-build
      context: ./frontend
      dockerfile_inline: |
        FROM node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
        RUN mkdir -p /web/node_modules /home/node/.npm && chown -R node:node /web /home/node/.npm
        USER node
        WORKDIR /web
    image: bss-web:dev
    profiles: [web]
    volumes: &web-volumes
      - ./frontend:/web
      - web_node_modules:/web/node_modules
      - web_npm_cache:/home/node/.npm
      - ./spec:/spec:ro
    environment:
      API_URL: http://app:8080
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      app:
        condition: service_healthy
    networks: [lab]
    command: ["npm", "run", "dev"]

  web-offline:
    build: *web-build
    image: bss-web:dev
    profiles: [web]
    volumes: *web-volumes
    network_mode: none

  # make web-e2e: the BUILT UI (frontend/dist) served by `vite preview`, proxying /tmf-api
  # and /internal to the local app - the closest local stand-in for the shared Caddy.
  web-preview:
    build: *web-build
    image: bss-web:dev
    profiles: [web]
    volumes: *web-volumes
    environment:
      API_URL: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    networks: [lab]
    command: ["npx", "vite", "preview"]

  # make web-e2e: Playwright in its official image, the same version as @playwright/test
  # (pinned by digest). Runs as the WSL user against web-preview; writes nothing into
  # frontend/ (outputDir is /tmp). The JS packages come from the node_modules volume.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    profiles: [web]
    user: "1000:1000"
    working_dir: /web
    volumes: *web-volumes
    environment:
      E2E_BASE_URL: http://web-preview:4173
      HOME: /tmp
    shm_size: 1gb
    depends_on: [web-preview]
    networks: [lab]
    command: ["npx", "playwright", "test"]

  db:
    image: postgres:16-alpine
    # Local only, for test speed: every test clones and drops a database, and with fsync on
    # each drop waits for a server-wide checkpoint. Not crash-safe: after a WSL crash this
    # database may be corrupt - recover with `make clean`. Production uses vps-infra's
    # postgres and never sees this file.
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off", "-c", "synchronous_commit=off"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    healthcheck:
      # pg_isready alone only checks that the server accepts connections, not that our
      # credentials are valid — a stale/mismatched POSTGRES_PASSWORD would still report
      # healthy. Run an authenticated query too. $$VAR (not ${VAR}) so the password is
      # read from the container's own env at check time, not baked into the compose file.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' -tAq >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # No host port: nothing on the host needs one (tests and the app reach `db` on `lab`,
    # `make psql` goes through compose exec), and vps-lab's local stack publishes 5432.
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [lab]

volumes:
  pgdata:
  mcp_data:
  web_node_modules:
  web_npm_cache:

networks:
  lab:
