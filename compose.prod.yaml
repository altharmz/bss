# VPS overlay. Used explicitly: docker compose -f compose.yaml -f compose.prod.yaml ...
#
# Postgres and Caddy are NOT part of this stack: the vps-infra project runs one of each
# for every app on the host. We only join its `shared` network. Do not add db or caddy
# services back here.
#
# The VPS has 1 vCPU / 2 GB and runs a production VPN server. Every limit below exists
# so that this stack can never starve it: without mem_limit the OOM killer is free to
# pick the VPN process instead of us.
services:
  app:
    # No build section anywhere in this composition: the image is pre-built in WSL,
    # shipped with `docker save | ssh ... docker load`, and only started here.
    ports:
      - "127.0.0.1:18081:8080"
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: staging
      LOG_LEVEL: info
      # `postgres` is the service name in vps-infra; database and role are both
      # bss, created there with `make add-db NAME=bss`.
      DATABASE_URL: postgresql://bss:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bss
    networks:
      shared:
        # Every app on the shared network calls its service `app`, so that name is
        # ambiguous there. vps-infra's Caddyfile reaches us as bss:8080.
        aliases: [bss]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared:
    # Created and owned by vps-infra; must exist before this stack starts.
    external: true
    name: shared
