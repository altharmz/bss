# VPS overlay. Used explicitly: docker compose -f compose.yaml -f compose.prod.yaml ...
#
# Postgres and Caddy are NOT part of this stack: the vps-infra project runs one of each
# for every app on the host. We only join its per-app networks `bss-edge` (Caddy + app +
# mcp) and `bss-db` (postgres + app + worker); bss is not on `shared`. Do not add db or
# caddy services back here.
#
# The VPS has 1 vCPU / 2 GB and runs a production VPN server. Every limit below exists
# so that this stack can never starve it: without mem_limit the OOM killer is free to
# pick the VPN process instead of us.
services:
  app:
    # No build section anywhere in this composition: the image is pre-built in WSL,
    # shipped with `docker save | ssh ... docker load`, and only started here.
    ports:
      - "127.0.0.1:18081:8080"
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Starting takes >30 s at 0.5 CPU next to mcp (which imports the app too) and the
    # worker: keep the image's probe at every 2 s for up to 3 minutes, so deploy.sh's wait
    # sees "healthy" as soon as it answers (2026-10-18: with the image's 30 s the first
    # probe after it came past the 90 s wait).
    healthcheck:
      start_period: 180s
    environment:
      APP_ENV: staging
      LOG_LEVEL: info
      # `postgres` is the service name in vps-infra; database and role are both
      # bss, created there with `make add-db NAME=bss`.
      DATABASE_URL: postgresql://bss:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bss
      # /internal/v1/context and the account card report it; the worker writes it as
      # paymentDueDate - same value in both services
      BILL_PAYMENT_TERM_DAYS: "30"
      # the app authenticates every request (docs/decisions/users.md): mcp sends the
      # service secret, the web smoke the read-only smoke secret, both as X-Bss-Service
      BSS_SERVICE_SECRET: ${BSS_SERVICE_SECRET:?BSS_SERVICE_SECRET is required - see .env.example}
      BSS_SMOKE_SECRET: ${BSS_SMOKE_SECRET:?BSS_SMOKE_SECRET is required - see .env.example}
      # Caddy replaces X-Forwarded-For with the address it sees: the sign-in throttle keys
      # on its last entry, else the peer (loopback, the tunnel: trusted hosts anyway)
      APP_TRUST_FORWARDED: "true"
      BSS_METRICS_TOKEN: ${BSS_METRICS_TOKEN:-}
      BSS_BUILD: ${TAG:-dev}
      # Rollback drill only: scripts/deploy.sh sets it for the `up` of a release under
      # BSS_DEPLOY_DRILL=unhealthy, so its /healthz answers 503 (docs/operations.md "Rollback")
      BSS_HEALTH_DRILL: ${BSS_HEALTH_DRILL:-}
    networks:
      bss-edge:
        # Every app on the host calls its service `app`, so that name is ambiguous.
        # vps-infra's Caddyfile reaches us as bss:8080.
        aliases: [bss]
      bss-db: {}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The billing worker (stage 4): the same image, `python -m app.worker`. Serves no HTTP,
  # publishes nothing, has no alias. Only here - locally it runs one-shot (make worker-once).
  worker:
    image: ${IMAGE_NAME:-bss-app}:${TAG:-dev}
    command: ["python", "-m", "app.worker"]
    # Back after the 03:00 reboot and after a crash; a run left running is taken over.
    restart: unless-stopped
    # SIGTERM (compose up/stop) finishes the account in hand, then exits; 60 s is far more
    # than one account takes, so Docker's SIGKILL never lands inside one (D-W11).
    stop_grace_period: 60s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Same values as `app`. BILLING_TZ and BILLING_RUN_AT are passed to neither, so both
    # use the defaults in app/config.py and cannot disagree.
    environment:
      APP_ENV: staging
      LOG_LEVEL: info
      DATABASE_URL: postgresql://bss:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bss
      BILL_PAYMENT_TERM_DAYS: "30"
      BSS_BUILD: ${TAG:-dev}
    # Replaces the image's /healthz probe: the worker touches /tmp/worker-alive on every
    # wake-up (60 s) and after every account, retries included. Older than 3 minutes (or
    # missing) = unhealthy, which includes a database it cannot reach. No interpreter:
    # GNU find's -mmin -3 is an exact "< 180 s" (no rounding; proven at 179/181 s).
    # $$ keeps compose from interpolating. Informational only (docs/decisions/infra.md,
    # "Healthchecks").
    healthcheck:
      test: ["CMD", "bash", "-c", "[[ -n $$(find /tmp/worker-alive -mmin -3 2>/dev/null) ]]"]
      interval: 60s
      timeout: 3s
      start_period: 30s
      start_interval: 2s
      retries: 3
    networks: [bss-db]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The MCP connector (bss_mcp/, docs/mcp.md): the same image, its own process. Reaches
  # the app over HTTP only, as bss:8080 (`app` is ambiguous), and refuses to
  # start unless that answers as bss. Publishes nothing: the shared Caddy reaches it as
  # bss-mcp:8080 on `bss-edge` (docs/decisions/infra.md). Tokens and OAuth clients
  # live in SQLite on the mcp-data volume, not in the bss database; losing it only means
  # clients re-authorize and static tokens are issued again.
  mcp:
    image: ${IMAGE_NAME:-bss-app}:${TAG:-dev}
    # one process; --limit-concurrency answers 503 beyond 32 open requests (1 vCPU)
    command: ["uvicorn", "bss_mcp.main:app", "--host", "0.0.0.0", "--port", "8080",
              "--workers", "1", "--limit-concurrency", "32"]
    restart: unless-stopped
    # ~100 MB resident (the app's code is imported for the tool definitions), plus 16 MB
    # per password check in flight (scrypt)
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.25
    # Starting takes >30 s at 0.25 CPU (tool generation, identity check): keep the image's
    # probe at every 2 s for up to 2 minutes, so deploy.sh's wait sees "healthy" in time
    # (2026-10-12: with the image's 30 s the first probe after it came past the 90 s wait).
    healthcheck:
      start_period: 120s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: staging
      LOG_LEVEL: info
      BSS_API_URL: http://bss:8080
      # every OAuth URL (issuer, resource, endpoints, resource_metadata) is built from it;
      # the host's nginx routes bss2811 on 443 to Caddy's :8445 (vps-infra)
      MCP_PUBLIC_URL: https://bss2811.duckdns.org
      MCP_STORE: /data/mcp.db
      # behind Caddy: the client IP is the last X-Forwarded-For entry (Caddy sets it)
      MCP_TRUST_FORWARDED: "true"
      BSS_METRICS_TOKEN: ${BSS_METRICS_TOKEN:-}
      BSS_BUILD: ${TAG:-dev}
      # same value as the app's: without it every tool call is a 401
      BSS_SERVICE_SECRET: ${BSS_SERVICE_SECRET:?BSS_SERVICE_SECRET is required - see .env.example}
    volumes:
      - mcp-data:/data
    networks:
      bss-edge:
        aliases: [bss-mcp]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # the mcp service's SQLite store (tokens, OAuth clients) - never pruned by us
  mcp-data:

networks:
  # Created and owned by vps-infra; must exist before this stack starts.
  bss-edge:
    external: true
    name: bss-edge
  bss-db:
    external: true
    name: bss-db
