# Harness infrastructure: never included in task Compose projects or task cleanup.
name: bss-telemetry
services:
  db:
    image: postgres:16-alpine
    network_mode: none
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      # No TCP network; only local socket clients inside this container are allowed.
      POSTGRES_HOST_AUTH_METHOD: reject
      POSTGRES_PASSWORD: local-socket-only
    volumes:
      - data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U telemetry -d telemetry]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  data:
    name: bss-telemetry-data
