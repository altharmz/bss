# Base definition: only what local dev and the VPS have in common.
# Local dev is this file + compose.override.yaml (auto-loaded) — adds its own postgres.
# Production is this file + compose.prod.yaml (explicit, see scripts/deploy.sh) — joins
# the shared network and uses the postgres run by the vps-infra project.
#
# Deliberately no database, DATABASE_URL, depends_on or networks here: each mode wires
# those differently, and anything listed in this file is merged into both.
name: bss

services:
  app:
    image: ${IMAGE_NAME:-bss-app}:${TAG:-dev}
    environment:
      APP_ENV: ${APP_ENV:-dev}
