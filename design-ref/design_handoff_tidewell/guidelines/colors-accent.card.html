<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}.c{height:56px;border-radius:10px;border:1px solid var(--border-hairline)}.s b{display:block;font-size:12px;color:var(--text-strong);margin-top:6px;font-weight:600}.s code{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head><body><div class="row"><div class="s"><div class="c" style="background:var(--tide-50)"></div><b>Tide 50</b><code>--tide-50</code></div><div class="s"><div class="c" style="background:var(--tide-100)"></div><b>Tide 100</b><code>--tide-100</code></div><div class="s"><div class="c" style="background:var(--tide-200)"></div><b>Tide 200</b><code>--tide-200</code></div><div class="s"><div class="c" style="background:var(--tide-400)"></div><b>Tide 400</b><code>--tide-400</code></div><div class="s"><div class="c" style="background:var(--tide-600)"></div><b>Tide 600 · accent</b><code>--tide-600</code></div><div class="s"><div class="c" style="background:var(--tide-700)"></div><b>Tide 700 · hover</b><code>--tide-700</code></div><div class="s"><div class="c" style="background:var(--tide-800)"></div><b>Tide 800 · press</b><code>--tide-800</code></div></div></body></html>
