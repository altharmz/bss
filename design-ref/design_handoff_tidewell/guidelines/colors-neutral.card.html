<!-- @dsCard group="Colors" viewport="700x230" name="Sand neutrals" subtitle="Warm neutral ladder — no cool greys" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}.c{height:56px;border-radius:10px;border:1px solid var(--border-hairline)}.s b{display:block;font-size:12px;color:var(--text-strong);margin-top:6px;font-weight:600}.s code{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head><body><div class="row"><div class="s"><div class="c" style="background:var(--sand-0)"></div><b>0</b><code>--sand-0</code></div><div class="s"><div class="c" style="background:var(--sand-50)"></div><b>50 · page</b><code>--sand-50</code></div><div class="s"><div class="c" style="background:var(--sand-100)"></div><b>100</b><code>--sand-100</code></div><div class="s"><div class="c" style="background:var(--sand-200)"></div><b>200 · hairline</b><code>--sand-200</code></div><div class="s"><div class="c" style="background:var(--sand-300)"></div><b>300 · strong</b><code>--sand-300</code></div><div class="s"><div class="c" style="background:var(--sand-400)"></div><b>400</b><code>--sand-400</code></div><div class="s"><div class="c" style="background:var(--sand-500)"></div><b>500</b><code>--sand-500</code></div><div class="s"><div class="c" style="background:var(--sand-600)"></div><b>600 · muted</b><code>--sand-600</code></div><div class="s"><div class="c" style="background:var(--sand-700)"></div><b>700 · body</b><code>--sand-700</code></div><div class="s"><div class="c" style="background:var(--sand-800)"></div><b>800</b><code>--sand-800</code></div><div class="s"><div class="c" style="background:var(--sand-900)"></div><b>900 · ink</b><code>--sand-900</code></div><div class="s"><div class="c" style="background:var(--sand-950)"></div><b>950</b><code>--sand-950</code></div></div></body></html>
