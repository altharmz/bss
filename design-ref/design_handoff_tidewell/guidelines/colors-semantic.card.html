<!-- @dsCard group="Colors" viewport="700x170" name="Semantic" subtitle="Status colors, each with a soft fill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.p{border-radius:10px;overflow:hidden;border:1px solid var(--border-hairline)}.p div{height:44px}.p span{display:block;padding:6px 8px;font-size:12px;font-weight:600;color:var(--text-strong);background:var(--surface-card)}</style></head><body><div class="g"><div class="p"><div style="background:var(--success)"></div><div style="background:var(--success-soft);height:28px"></div><span>Success</span></div><div class="p"><div style="background:var(--warning)"></div><div style="background:var(--warning-soft);height:28px"></div><span>Warning</span></div><div class="p"><div style="background:var(--danger)"></div><div style="background:var(--danger-soft);height:28px"></div><span>Danger</span></div><div class="p"><div style="background:var(--info)"></div><div style="background:var(--info-soft);height:28px"></div><span>Info</span></div><div class="p"><div style="background:var(--highlight)"></div><div style="background:var(--highlight-soft);height:28px"></div><span>Ember highlight</span></div></div></body></html>
