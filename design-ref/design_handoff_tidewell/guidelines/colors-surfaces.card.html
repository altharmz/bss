<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.b{height:110px;border-radius:12px;border:1px solid var(--border-hairline);padding:12px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px}.b code{font-family:var(--font-mono);font-size:10.5px;opacity:.8}</style></head><body><div class="g"><div class="b" style="background:var(--surface-page);color:var(--text-strong)"><b>Page</b><code>--surface-page</code></div><div class="b" style="background:var(--surface-card);color:var(--text-strong)"><b>Card</b><code>--surface-card</code></div><div class="b" style="background:var(--surface-soft);color:var(--text-body)"><b>Soft</b><code>--surface-soft</code></div><div class="b" style="background:var(--surface-sunken);color:var(--text-muted)"><b>Sunken</b><code>--surface-sunken</code></div><div class="b" style="background:var(--surface-inverse);color:var(--text-inverse)"><b>Inverse</b><code>--surface-inverse</code></div></div></body></html>
