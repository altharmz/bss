<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Hairlines first; shadows only for floating layers" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:8px 0}.g div{height:100px;border-radius:14px;background:var(--surface-card);padding:12px;font-size:12px;font-weight:600;color:var(--text-strong)}.g code{display:block;font-family:var(--font-mono);font-weight:400;font-size:10.5px;color:var(--text-muted);margin-top:4px}</style></head><body><div class="g"><div style="background:var(--surface-soft)">Inset<code>surface-soft</code></div><div style="border:1px solid var(--border-hairline)">Card<code>1px hairline</code></div><div style="border:1px solid var(--border-hairline);box-shadow:var(--shadow-pop)">Hover / popover<code>--shadow-pop</code></div><div style="border:1px solid var(--border-hairline);box-shadow:var(--shadow-dialog)">Dialog<code>--shadow-dialog</code></div></div></body></html>
