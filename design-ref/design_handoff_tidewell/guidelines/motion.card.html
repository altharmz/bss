<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.r{display:flex;gap:16px;align-items:center;margin-bottom:12px;font-size:13px}.r code{width:200px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.t{width:300px;height:8px;background:var(--surface-sunken);border-radius:9px;position:relative}.t i{position:absolute;left:0;top:-4px;width:16px;height:16px;border-radius:9px;background:var(--accent);animation:m 1.6s var(--ease-out) infinite alternate}@keyframes m{to{left:284px}}</style></head><body><div class="r"><code>--dur-fast 120ms</code>hover, press, focus</div><div class="r"><code>--dur-base 200ms</code>toggles, cards, tooltips</div><div class="r"><code>--dur-slow 320ms</code>dialogs, toasts</div><div class="r"><code>--ease-out</code><div class="t"><i></i></div></div></body></html>
