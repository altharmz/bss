  # ---------------- worker: behaviour (stage 4) ----------------
  # Proven, not detected: an item is implemented and tested when at least one test marked
  # @pytest.mark.capability("<id>") passes and none fails (make progress runs them).
  - {id: worker.runLifecycle, area: worker, stage: 4, title: "start_run answers every case: new, completed (no-op), failed (reopen), running"}
  - {id: worker.takeover, area: worker, stage: 4, title: "Takeover of a running run whose owner died; ok accounts untouched"}
  - {id: worker.doubleStart, area: worker, stage: 4, title: "A second worker while the lock is held backs off and writes nothing"}
  - {id: worker.failureIsolation, area: worker, stage: 4, title: "A failed account blocks only itself; after a fix it catches up its dates in order"}
  - {id: worker.wholeRunFailure, area: worker, stage: 4, title: "A whole-run failure does not advance past its date; retried with backoff"}
  - {id: worker.completedAllOk, area: worker, stage: 4, title: "A run is completed only when every member account is ok"}
  - {id: worker.requestQueue, area: worker, stage: 4, title: "Catch-up and retry requests from the UI queue are processed"}
  - {id: worker.statusFlips, area: worker, stage: 4, title: "Status flips (created -> active, pendingTerminate -> terminated) by run date"}
  - {id: worker.scheduler, area: worker, stage: 4, title: "Scheduler and --once: dates due at BILLING_RUN_AT, automatic catch-up of today and yesterday"}
  - {id: worker.numberPorting, area: worker, stage: 5, title: "Port-in requests are submitted and followed with the carrier and hold the line's activation until completed; a reported port-out is validated against the Number Transfer PIN, ends the product through an order and locks the number"}
  - {id: worker.prepaidLifecycle, area: worker, stage: 5, title: "An unfunded prepaid line follows grace, suspension and deactivation by business date through internal orders; a top-up brings it back; the deactivated number is aged"}
  - {id: worker.simInventory, area: worker, stage: 5, title: "Activation picks a SIM or eSIM from stock; a SIM swap moves the line to another SIM when the network confirms"}
  - {id: worker.networkProvisioning, area: worker, stage: 5, title: "Prepaid order items send their network command and complete only when the network confirms"}
  - {id: worker.taxEngine, area: worker, stage: 5, title: "Prepaid charges are taxed by the tax engine for the account's service address; an unavailable engine retries and books nothing"}
  - {id: worker.paymentGateway, area: worker, stage: 5, title: "Card charges go to the payment gateway and the balance rises only when it confirms; automatic top-up below a threshold"}
  - {id: worker.prepaidPlans, area: worker, stage: 5, title: "Plan purchase with one-time fees, renewal from the balance or the card, add-on packs that end with the period, pay-as-you-go lines"}
  - {id: worker.signals, area: worker, stage: 4, title: "SIGTERM finishes the current account; SIGKILL leaves nothing half-written"}
  - {id: worker.billIssue, area: worker, stage: 5, title: "The run validates and issues the bills it writes (new -> validated -> sent; credit notes and zero bills settled)"}
  - {id: worker.billSettle, area: worker, stage: 5, title: "Every run applies unused credit to open bills, oldest first"}
  - {id: worker.eventDelivery, area: worker, stage: 5, title: "Due events are POSTed to hub callbacks, retried with backoff"}

