# Implementation scope for the progress tracker (make progress -> docs/PROGRESS.md).
# Hand-maintained; editable within authorized feature work. Preserve existing scope.
#
# items:     everything planned. id = <area>.<name>; stage = the project stage that plans it
#            (template = came with vps-lab-template).
#            db:  table   - implemented when the table exists after migrating to head
#            api: method + path - implemented when app.openapi() has that operation (the path
#                 template exactly as FastAPI reports it, parameter names included)
#            ui:  the id itself is the marker - implemented when a literal data-ui="<id>"
#                 (or <Modal ui="<id>">) exists in frontend/src
#            worker: the id itself is the capability - implemented and tested when a test
#                 marked @pytest.mark.capability("<id>") passes and none fails
# excluded:  things that exist (or could appear) in the code but are deliberately not
#            tracked, with the reason; the unscoped check ignores them.
# Status (implemented / tested / deployed) is never written here - it is derived.

