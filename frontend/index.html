<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280" />
    <!-- The build that is live: deploy.sh sets VITE_BSS_BUILD to the commit, the web
         smoke test reads it back through Caddy. -->
    <meta name="bss-build" content="%VITE_BSS_BUILD%" />
    <title>BSS Console</title>
    <script>
      // Apply the saved theme before first paint (same key as src/app/theme.ts).
      try {
        var t = localStorage.getItem('bss.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
