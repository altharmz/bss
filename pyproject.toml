[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = "/tmp/ruff-cache"
# Generated migration bodies (e.g. an empty initial revision) don't always use the
# op/sa imports Alembic's template always includes - don't fight that here.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Cookie()/etc-as-default-argument is the framework's own dependency
# injection idiom, not the mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Cookie", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Dummy credentials in test fixtures aren't hardcoded production secrets.
"tests/*" = ["S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "smoke: the CI gate on pull requests and master (make test-smoke); the nightly run runs everything",
    "capability(id): proves a worker capability of docs/progress/scope.yaml (make progress runs these tests)",
    "migration_history: replays a deployed migration; make test leaves it out, the hook runs it when alembic/, the pins or the image change (make test-all runs everything)",
    "slow: one of the slowest tests; make test leaves it out, the hook runs it when the seed, load-test, gap-probe or usage-generator code changes (make test-all runs everything)",
]
cache_dir = "/tmp/pytest_cache"
