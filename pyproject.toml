[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = "/tmp/ruff-cache"
# Generated migration bodies (e.g. an empty initial revision) don't always use the
# op/sa imports Alembic's template always includes - don't fight that here.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Cookie()/etc-as-default-argument is the framework's own dependency
# injection idiom, not the mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Cookie", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Dummy credentials in test fixtures aren't hardcoded production secrets.
"tests/*" = ["S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
cache_dir = "/tmp/pytest_cache"
