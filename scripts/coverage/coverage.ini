# make coverage (#480): coverage.py for the backend suite. The Makefile copies this file and
# sitecustomize.py to .testmon/coverage/ (mounted as /testmon), so every Python process the
# suite starts - xdist workers and the worker/MCP subprocesses - records into one place.
[run]
parallel = True
source = app, bss_mcp
data_file = /testmon/coverage/.coverage
