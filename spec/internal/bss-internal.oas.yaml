openapi: 3.0.3
info:
  title: BSS internal API (admin UI)
  version: 1.0.0
  description: >-
    Ours, not TMF. Served by the app under /internal/v1 for the admin UI (stage 5): what
    the TMF APIs cannot answer without the UI re-implementing billing rules. Same
    conventions as the TMF surface - TMF Error bodies, Money as {unit, value} with exact
    2-decimal values, offset/limit paging with X-Result-Count and Link rel=next (no
    X-Total-Count, #312) - except
    that dates are plain business dates (YYYY-MM-DD in BILLING_TZ). Every response in the
    test suite is validated against this file (tests/apiclient.py), and the UI's
    TypeScript types are generated from it. Schemas are strict (additionalProperties:
    false) so that any drift between code and contract fails a test.
servers:
  - url: /internal/v1
security:
  - AppSession: []
  - ServiceCredential: []
paths:
  /session:
    post:
      summary: Sign in and set a revocable HttpOnly session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignIn'}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
    get:
      summary: Current authenticated user.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
    delete:
      summary: Revoke this session and clear its cookie.
      responses:
        '204': {description: Signed out}
  /session/password:
    post:
      summary: Change own password and revoke all sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePassword'}
      responses:
        '204': {description: Password changed; sign in again}
  /service/credential-check:
    post:
      summary: MCP login backend - check an mcp user's password (service credential only).
      description: >
        Accepted only with the MCP service credential (X-Bss-Service); a session or the
        smoke credential gets 403. Only users with role mcp may log in through MCP: 401
        invalidCredentials covers an unknown user, a wrong password, a disabled user and
        an admin or user alike. An mcp user never has to change its password first.
        Rate limited like sign-in.
      security:
        - ServiceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignIn'}
      responses:
        '200':
          description: The password is right for an active mcp user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CredentialCheck'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /users:
    get:
      summary: List users (admin only).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
    post:
      summary: Create a user (admin only); admin and user change the initial password at first sign-in, an mcp user keeps it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUser'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    patch:
      summary: Change role, disable or enable, or reset password (admin only); a role change to or from mcp must carry a new password (422 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditUser'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
  /context:
    get:
      summary: Business date, time zone, environment and operator for the UI chrome.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Context'}
        '400': {$ref: '#/components/responses/Error'}
  /billingAccount/{id}/firstCharge:
    get:
      summary: Dry run of the first charge an add order would cause.
      description: >-
        Runs the stage 3 billing core on the hypothetical product. The charge is written by
        the billing run of chargeRunDate = max(startDate, businessDate + 1) and lands on the
        bill of billDate, the first cycle day on or after chargeRunDate. On a prepaid account
        the first interval starts on startDate and is paid in full at once: the answer adds
        required, available and shortfall.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - name: productOffering.id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: startDate
          in: query
          required: true
          schema: {type: string, format: date}
        - name: product.id
          in: query
          required: false
          description: >-
            Prepaid accounts only. The product whose offering would change on startDate: the
            answer adds credit (the unused dates of its paid interval, tax included) and
            balanceAfter counts it.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirstCharge'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /billingAccount/{id}/products:
    get:
      summary: The account's products that are not ended, oldest start first.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccountProduct'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /billingAccount/{id}/settlement:
    get:
      summary: What the account owes on its bills, and the credit not used yet.
      description: >-
        outstanding = the remaining amounts of every bill, bills on hold included (counted
        apart in onHold); overdue = bills due before the business date with something
        remaining (display only); unallocatedCredit = payments and issued credit notes not
        yet applied to a bill. Invariant: outstanding - unallocatedCredit = -(account
        balance + charges not billed yet).
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountSettlement'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /customerBill/{id}:
    get:
      summary: One bill for the bill dialog - charges, sources, state history, allowed states.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillDetail'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /billingAccount/{id}/charges:
    get:
      summary: The account's applied billing rates (charges and refunds), newest first.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Charge'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /billingAccount/{id}/transactions:
    get:
      summary: Charges, refunds and payments with the balance after each, newest first.
      description: >-
        Positive amounts are credits to the customer, as in TMF666 accountBalance. The
        newest balanceAfter is the account's balance.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Transaction'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /productOffering/{id}/priceChange:
    post:
      summary: Change an offering's recurring price atomically (ours; TMF620 cannot).
      description: >-
        In one transaction: ends the open-ended recurring price in `currency` exactly at
        midnight (BILLING_TZ) of `validFrom` and creates the successor, attached, from that
        moment - never a gap, never an overlap; all of it or none of it. TMF620 needs two
        requests for this, and neither order works while a product is live: the successor
        would overlap the open price (no-overlap constraint), and ending first would leave
        the product without a price (refused). Existing products pick up the new price
        from their first billing period starting on or after validFrom; new orders from
        validFrom.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PriceChangeRequest'}
      responses:
        '201':
          description: Changed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PriceChange'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /subscriber:
    get:
      summary: The Subscribers screen's list - billing accounts with their customer, oldest first.
      description: >-
        Paged with Link rel=next, no count (#312). q matches by prefix: a customer or
        account name (case-insensitive), a subscriber number on a line today, or a short id
        (a prefix of the account or customer id; BA- optional); a full uuid is the account
        (#314). activeProducts and customerAccounts are computed for the page.
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
        - name: state
          in: query
          schema: {type: string, enum: [Active, Suspended, Closed]}
        - name: ratingType
          in: query
          schema: {type: string, enum: [prepaid, postpaid]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SubscriberRow'}
        '400': {$ref: '#/components/responses/Error'}
  /party:
    get:
      summary: The Parties screen's individuals and organizations, oldest first.
      description: >-
        Paged with Link rel=next, no count (#312). q matches by prefix, case-insensitive:
        an individual's given name, "given family" or family name, an organization's name;
        or a short id (a prefix of the id) or the full id (#314). customers,
        billingAccounts and ownsAccounts are computed for the page.
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - name: kind
          in: query
          schema: {type: string, enum: [Individual, Organization]}
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
        - name: status
          in: query
          schema: {type: string, enum: [initialized, validated, deceased, closed]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PartyRow'}
        '400': {$ref: '#/components/responses/Error'}
  /partyCustomer:
    get:
      summary: The Parties screen's customers, oldest first, each with its party.
      description: >-
        Paged with Link rel=next, no count (#312). q matches the customer name by prefix
        (case-insensitive), or a short or full id (#314). billingAccounts is computed for
        the page.
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
        - name: status
          in: query
          schema: {type: string, enum: [Created, Active, Inactive]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PartyCustomerRow'}
        '400': {$ref: '#/components/responses/Error'}
  /billingRun:
    get:
      summary: Billing runs, newest run date first (stage 4).
      description: >-
        Every count is derived: total = the accounts opened before 00:00 of the run date
        (its members), ok/failed/blocked = their outcomes so far; charges = the applied
        billing rates the run wrote, per currency (refunds negative).
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BillingRun'}
        '400': {$ref: '#/components/responses/Error'}
  /billingRun/{id}:
    get:
      summary: One billing run.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingRun'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /billingRun/{id}/accounts:
    get:
      summary: A run's per-account outcomes, in account id order.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - name: status
          in: query
          schema: {type: string, enum: [ok, failed, blocked]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RunAccount'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /billingRun/catchUp:
    post:
      summary: Queue a catch-up to a date; the worker runs the dates in order.
      description: >-
        The API never bills: it queues a request the worker carries out within a minute.
        upTo must be the business date or earlier, and today only from BILLING_RUN_AT on
        (the run of a date is due at that time, not at 00:00) - 422 otherwise. The dates:
        a run that failed as a whole first (an operator's catch-up is not held to the
        backoff), then every date after the latest run. 202 with the request and the
        dates; 200 with no dates (nothing queued) when nothing is due.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatchUpRequest'}
      responses:
        '200':
          description: Nothing is due; nothing was queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatchUp'}
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatchUp'}
        '400': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /billingRun/{id}/retry:
    post:
      summary: Queue a retry of a failed run.
      description: >-
        Any failed run. A run that failed because of accounts retries only its failed
        accounts (each one then catches up its blocked later dates in order); a run that
        failed as a whole runs its date again. 409 if the run is not failed or a retry of
        it is already queued.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetryQueued'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /eventSubscription:
    get:
      summary: Live event subscriptions (hubs) of every API, newest first (stage 5).
      description: >-
        An operator view, not a TMF operation: TMF defines POST/DELETE /hub per API and no
        list. Deleted hubs are not listed. Filter by api (TMF number). The delivery summary
        comes from the outbox - the last attempted delivery and the count of deliveries
        that failed for good.
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - name: api
          in: query
          schema: {type: string, pattern: '^TMF[0-9]{3}$'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EventSubscription'}
        '400': {$ref: '#/components/responses/Error'}
  /prepaid/command:
    get:
      summary: Prepaid commands, newest acceptance first (P3i).
      description: >-
        The internal prepaid command journal: order, renewal and transfer commands with
        their internal state (pending, completed, failedTechnical - not TMF enums), outcome,
        technical error, current needs-top-up reason, attempt times and linked order,
        products, run and bills. Filter by billing account and state.
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - name: billingAccount.id
          in: query
          schema: {type: string, format: uuid}
        - name: state
          in: query
          schema: {type: string, enum: [pending, completed, failedTechnical]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PrepaidCommand'}
        '400': {$ref: '#/components/responses/Error'}
  /prepaid/command/{id}:
    get:
      summary: One prepaid command.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrepaidCommand'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /prepaid/command/{id}/retry:
    post:
      summary: Return a failedTechnical prepaid command to pending.
      description: >-
        No body. The API never posts: the command keeps its identity, request, hold and
        attempt count, and the billing worker attempts it on its next tick. 202 with the
        command; 409 unless it is failedTechnical.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrepaidCommand'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /lifecycle/settings:
    get:
      summary: The prepaid lifecycle durations (issue 188).
      description: >-
        Grace, suspension and number-aging days and the pay-as-you-go zero-balance trigger.
        Defaults (3, 30, 90, 7) apply from the migration; `updatedAt` is null until an
        operator changes them.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LifecycleSettings'}
        '400': {$ref: '#/components/responses/Error'}
    put:
      summary: Change the prepaid lifecycle durations.
      description: >-
        Any of the four durations, at least one; the others keep their value. The worker
        derives every transition from them on each tick, so a change applies to every
        transition not yet taken; transitions already taken stand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                graceDays: {type: integer, minimum: 0, maximum: 365}
                suspensionDays: {type: integer, minimum: 0, maximum: 3650}
                numberAgingDays: {type: integer, minimum: 0, maximum: 3650}
                paygZeroBalanceDays: {type: integer, minimum: 0, maximum: 365}
      responses:
        '200':
          description: The settings now in force
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LifecycleSettings'}
        '400': {$ref: '#/components/responses/Error'}
  /logging:
    get:
      summary: The runtime log level (issue 274); administrators only.
      description: >-
        `baseLevel` is WARNING, INFO or null (follow `envLevel`, the LOG_LEVEL of the
        environment). DEBUG exists only as `debugUntil`, an instant at most 120 minutes ahead;
        `effectiveLevel` is DEBUG while now < `debugUntil`, else the base level, else `envLevel`.
        The app, the worker and the MCP connector re-read it every 15 s.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogSettings'}
        '403': {$ref: '#/components/responses/Error'}
    put:
      summary: Set the base log level and/or start or end a temporary DEBUG.
      description: >-
        `baseLevel` WARNING, INFO or null (follow LOG_LEVEL); `debugMinutes` 0..120 starts DEBUG
        for that long from now (0 ends it now). At least one field; the other keeps its value.
        Every change is audited and logged at WARNING. A bad value is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                baseLevel: {type: string, enum: [WARNING, INFO, null], nullable: true}
                debugMinutes: {type: integer, minimum: 0, maximum: 120}
      responses:
        '200':
          description: The setting now in force
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogSettings'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /service/log-level:
    get:
      summary: The MCP connector's poll of the runtime log level (service credential only).
      description: >-
        Accepted only with the MCP service credential (X-Bss-Service) and no principal; a
        session or the smoke credential gets 403. The connector has no database, so it reads
        the setting here and computes its own effective level.
      security:
        - ServiceCredential: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceLogLevel'}
        '403': {$ref: '#/components/responses/Error'}
  /device:
    get:
      summary: The devices of a prepaid line, newest first (issue 194).
      description: >-
        One row per IMEI the line has had: the network's compatibility answer when the order
        recorded it (compatible, or unknown with the reasons) and the times. The row without
        endedAt is the current device. An incompatible device is refused by the order and
        never stored.
      parameters:
        - name: product.id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProductDevice'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /device/check:
    get:
      summary: Ask the network whether a device works (issue 194).
      description: >-
        Stores nothing. result is compatible, incompatible or unknown (also when the network
        did not answer), with the network's reasons. 422 for an IMEI that is not 15 digits
        with a correct Luhn check digit.
      parameters:
        - name: imei
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceCheck'}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /network/command:
    get:
      summary: Network provisioning commands, newest first (issue 183).
      description: >-
        The commands of prepaid order items sent to the network (activate, suspend,
        restore, deactivate, change_profile, swap_sim) with their internal state, attempts, last
        error, refusal code, profile and the request as sent. Filter by order, product
        and state.
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - name: productOrder.id
          in: query
          schema: {type: string, format: uuid}
        - name: product.id
          in: query
          schema: {type: string, format: uuid}
        - name: state
          in: query
          schema: {type: string, enum: [pending, confirmed, refused, exhausted, cancelled]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/NetworkCommand'}
        '400': {$ref: '#/components/responses/Error'}
  /network/command/{id}:
    get:
      summary: One network command.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NetworkCommand'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /network/command/{id}/retry:
    post:
      summary: Return an exhausted network command to pending.
      description: >-
        No body. The API never sends: the command keeps its identity and request and the
        billing worker sends it on its next tick. 202 with the command; 409 unless it is
        exhausted (a refusal is final: the fix is a new order).
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NetworkCommand'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /billingAccount/{id}/cardTopup:
    post:
      summary: Queue a card top-up of a prepaid account (issue 185).
      description: >-
        Queues one charge of a saved card; the API never charges and never changes the
        balance. The billing worker submits it to the payment gateway and the balance
        rises only when the gateway confirms (a TMF676 payment and a TMF654 top-up are
        then recorded). 202 with the new command; 200 with the first command when the same
        idempotencyKey is sent again with the same amount and card; 409 if they differ, the
        account has no default card, the card expired or the account is closed.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CardTopupRequest'}
      responses:
        '200':
          description: The command of the same idempotencyKey
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentCommand'}
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentCommand'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    get:
      summary: The card charges of one billing account, newest first.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PaymentCommand'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /billingAccount/{id}/autoTopup:
    get:
      summary: The account's auto top-up rule.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutoTopup'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      summary: Set the account's opt-in auto top-up rule.
      description: >-
        Prepaid accounts only. Turning it on needs a threshold and an amount (the amount at
        least the threshold); turning it off keeps them. Below the threshold the worker
        charges the default card for the amount, one attempt at a time; a declined attempt
        is not repeated until the balance or the settings change.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutoTopupRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutoTopup'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /payment/command:
    get:
      summary: Card charges to the payment gateway, newest first (issue 185).
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - name: billingAccount.id
          in: query
          schema: {type: string, format: uuid}
        - name: state
          in: query
          schema: {type: string, enum: [pending, sent, confirmed, declined, exhausted, cancelled]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PaymentCommand'}
        '400': {$ref: '#/components/responses/Error'}
  /payment/command/{id}:
    get:
      summary: One card charge.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentCommand'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /payment/command/{id}/retry:
    post:
      summary: Return an exhausted card charge to pending.
      description: >-
        No body. The API never sends: the command keeps its key and request and the billing
        worker submits it on its next tick. 202 with the command; 409 unless it is exhausted
        (a decline is final: make a new top-up).
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentCommand'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sim/batch:
    get:
      summary: Stocked SIM and eSIM batches with their counts by state (issue 186).
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SimBatch'}
        '400': {$ref: '#/components/responses/Error'}
    post:
      summary: Stock a batch of physical SIMs or eSIM profiles, all or nothing.
      description: >-
        JSON {batch, simType, items: [{iccid, imsi, smdpAddress, matchingId}]} or text/csv
        (header row iccid,imsi[,smdpAddress,matchingId]; query batch and simType). At most
        5000 rows. 422 names the bad rows (format, a repeated ICCID or IMSI in the file,
        eSIM columns missing or sent for a physical SIM, Ki or OPc columns, which are never
        accepted or stored); 409 when the batch name or an ICCID/IMSI already exists.
        Each SIM becomes a TMF639 resource (IMSI) in stock.
      parameters:
        - name: batch
          in: query
          description: CSV only.
          schema: {type: string}
        - name: simType
          in: query
          description: CSV only.
          schema: {type: string, enum: [physical, esim]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [batch, simType, items]
              properties:
                batch: {type: string, pattern: '^[A-Za-z0-9._-]{1,60}$'}
                simType: {type: string, enum: [physical, esim]}
                items:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    additionalProperties: false
                    required: [iccid, imsi]
                    properties:
                      iccid: {type: string}
                      imsi: {type: string}
                      smdpAddress: {type: string}
                      matchingId: {type: string}
          text/csv:
            schema: {type: string}
      responses:
        '201':
          description: Stocked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimBatch'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /sim/esim-generate:
    post:
      summary: Ask the network adapter for eSIM profiles and stock them as a batch.
      description: >-
        Synchronous: an operator request that changes no line. The stub generates
        deterministic profiles; a real adapter may later make this asynchronous. 503 when
        the network cannot generate now; 409 when the batch name or a generated identity
        already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [batch, count]
              properties:
                batch: {type: string, pattern: '^[A-Za-z0-9._-]{1,60}$'}
                count: {type: integer, minimum: 1, maximum: 5000}
      responses:
        '201':
          description: Stocked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimBatch'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /number/pool:
    post:
      summary: Request numbers of an area code from the carrier (issue 189).
      description: >-
        Synchronous operator request through the network adapter; the numbers become
        unlocked TMF639 subscriber numbers (origin pool). 409 when the carrier has no more
        numbers for the area code; 503 when it cannot give numbers now. A number the BSS
        already holds is not created twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [areaCode, count]
              properties:
                areaCode: {type: string, pattern: '^[2-9][0-9]{2}$'}
                count: {type: integer, minimum: 1, maximum: 100}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NumberPool'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /usage/summary:
    get:
      summary: Usage of a line against its plan allowance (issue 190).
      description: >-
        The plan period (funded interval) covering today, or `date`, with per kind used,
        included (the profile the network was last told, add-ons included), remaining, percent
        and the 80/100 marks reached, and whether the line is throttled. A line without a plan
        period (not prepaid, or no grant covers the day) has period null and no allowances.
      parameters:
        - name: product.id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: date
          in: query
          schema: {type: string, format: date}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSummary'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /report/kpi:
    get:
      summary: Prepaid KPIs by month (issue 198).
      description: >-
        Per calendar month of business dates, for the prepaid accounts of one currency: lines
        (opening, gross adds, disconnects, net adds, closing, average), churn rate, tax-excluded
        revenue by source and ARPU. A line is a prepaid product that is not an add-on, live on
        the days from its start date to the day before its termination date. `to` defaults to
        the business month, `from` to eleven months before `to`; at most 24 months; the current
        month runs to the business date (complete false). Read-only, computed on request.
      parameters:
        - name: from
          in: query
          schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
        - name: to
          in: query
          schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
        - name: currency
          in: query
          description: Defaults to the UI currency.
          schema: {type: string, pattern: '^[A-Z]{3}$'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KpiReport'}
        '400': {$ref: '#/components/responses/Error'}
  /port:
    get:
      summary: Port requests, newest first (issue 189).
      description: Port-in and port-out requests with state, reason and the linked order. Filter by direction, state and number.
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - name: direction
          in: query
          schema: {type: string, enum: [in, out]}
        - name: state
          in: query
          schema: {type: string, enum: [submitted, pending, rejected, completed, cancelled]}
        - name: number
          in: query
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PortRequest'}
        '400': {$ref: '#/components/responses/Error'}
  /port/in:
    post:
      summary: Record a port-in, the customer brings a number (issue 189).
      description: >-
        Creates the number in inventory (origin port_in) and a request in state submitted;
        the API never contacts the carrier, the billing worker submits it. The activation
        order then claims the number: the line's activation waits for the port to complete.
        409 when the number is already in inventory (other than a port-in without an open
        request) or already has a port-in request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [number, carrierAccountNumber, transferPin, billingZip, firstName, lastName]
              properties:
                number: {type: string, pattern: '^[1-9][0-9]{7,14}$'}
                carrierAccountNumber: {type: string, maxLength: 80}
                transferPin: {type: string, maxLength: 40}
                billingZip: {type: string, pattern: '^[0-9]{5}(-[0-9]{4})?$'}
                firstName: {type: string, maxLength: 80}
                lastName: {type: string, maxLength: 80}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortRequest'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /port/pin:
    get:
      summary: Number Transfer PINs of a line, without the PIN itself (issue 189).
      parameters:
        - name: product.id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TransferPin'}
        '400': {$ref: '#/components/responses/Error'}
    post:
      summary: Generate a Number Transfer PIN for a line (issue 189).
      description: >-
        For an active or suspended product with a current subscriber number. The PIN is in
        the response once and is never stored or listed again; an earlier PIN of the line is
        revoked. It is valid for BSS_NUMBER_TRANSFER_PIN_DAYS (default 7) and single use.
        409 when the product is not such a line. On a prepaid line it needs the customer's
        account PIN in the X-Account-Pin header and is refused (403) without a valid one
        (`pinRequired`, `pinInvalid`, `pinNotSet`, `pinLocked`) or while the line has a port-out
        lock (`portOutLocked`); every attempt is audited (issue 193).
      parameters:
        - name: X-Account-Pin
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productId]
              properties:
                productId: {type: string, format: uuid}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferPin'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /port/{id}:
    get:
      summary: One port request.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortRequest'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /port/{id}/resubmit:
    post:
      summary: Resubmit a rejected port-in with corrected data.
      description: >-
        The transfer PIN is required again (it is cleared once the carrier has seen it);
        the other fields keep their value unless sent. 202: state submitted, the worker
        sends it. 409 unless the request is a rejected port-in.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transferPin]
              properties:
                transferPin: {type: string, maxLength: 40}
                carrierAccountNumber: {type: string, maxLength: 80}
                billingZip: {type: string, pattern: '^[0-9]{5}(-[0-9]{4})?$'}
                firstName: {type: string, maxLength: 80}
                lastName: {type: string, maxLength: 80}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortRequest'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /port/{id}/cancel:
    post:
      summary: Cancel an open port-in.
      description: >-
        No body. 409 unless the request is an open port-in (submitted, pending or
        rejected) and no order holds its number (cancel the order instead: it cancels the
        port).
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortRequest'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /notification/consent:
    get:
      summary: A customer's marketing consent and its history (issue 192).
      description: >-
        The current marketing consent per channel (null: never recorded, which means not opted
        in) and the append-only history, newest first. Transactional messages need no consent.
      parameters:
        - name: customer.id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationConsent'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      summary: Record an opt-in or opt-out of marketing messages (issue 192).
      description: >-
        Appends one consent row; the latest row of a channel wins. A marketing SMS or email is
        sent only while the customer's latest row for its channel is an opt-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customer, channel, optedIn, source]
              properties:
                '@type': {type: string}
                '@baseType': {type: string}
                '@schemaLocation': {type: string}
                customer:
                  type: object
                  required: [id]
                  properties:
                    id: {type: string, format: uuid}
                    href: {type: string}
                    name: {type: string}
                    '@type': {type: string}
                    '@referredType': {type: string}
                    '@baseType': {type: string}
                    '@schemaLocation': {type: string}
                channel: {type: string, enum: [sms, email]}
                optedIn: {type: boolean}
                source: {type: string, minLength: 1, maxLength: 200}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationConsent'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /notification/message/{id}/resend:
    post:
      summary: Send a message again (issue 192).
      description: >-
        No body. Queues a copy (TMF681 resendOf characteristic) of a message that is sent,
        failed or cancelled; the worker sends it. 409 while the message is still open or when it
        had no receiver address. Consent and quiet hours apply to the copy again.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResentMessage'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /security/pin/{id}:
    get:
      summary: A customer's account PIN status (issue 193).
      description: >-
        Whether the customer has an account PIN, who set it and when, the wrong attempts counted
        and until when verification is locked. The PIN and its hash are never returned.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountPin'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      summary: Set or reset a customer's account PIN (issue 193).
      description: >-
        An agent sets the PIN (6 to 8 digits, stored hashed) or resets it, with a reason that is
        recorded in the audit log (`pin_set`, `pin_reset`); a reset clears a lockout. The customer
        is told through the notification sender. No verification is asked: a customer who forgot the
        PIN cannot give it.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin, reason]
              properties:
                '@type': {type: string}
                '@baseType': {type: string}
                '@schemaLocation': {type: string}
                pin: {type: string, pattern: '^[0-9]{6,8}$'}
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountPin'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /security/lock/{id}:
    get:
      summary: The SIM swap and port-out locks of a line (issue 193).
      description: The id is the product. No row means both locks are off.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineLock'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      summary: Set or clear the SIM swap and port-out locks of a line (issue 193).
      description: >-
        Both flags are sent (the new state). While `simSwap` is set a SIM swap order is rejected
        (`simSwapLocked`); while `portOut` is set no Number Transfer PIN is issued and the carrier's
        port-out request is rejected (`portOutLocked`), even with a valid PIN. Setting a lock needs
        no PIN; clearing one needs the customer's PIN in the X-Account-Pin header (403
        `pinRequired`, `pinInvalid`, `pinNotSet`, `pinLocked`). A reason is recorded.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - name: X-Account-Pin
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [simSwap, portOut, reason]
              properties:
                '@type': {type: string}
                '@baseType': {type: string}
                '@schemaLocation': {type: string}
                simSwap: {type: boolean}
                portOut: {type: boolean}
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineLock'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /security/audit:
    get:
      summary: The audit log of agent actions on accounts, read only (issue 193).
      description: >-
        Newest first, paged. Each entry says who did what, when, whether it was done or refused
        (and why) and how the customer was verified. Filters customer.id, product.id,
        billingAccount.id, action, outcome, operator.
      parameters:
        - {name: customer.id, in: query, schema: {type: string, format: uuid}}
        - {name: product.id, in: query, schema: {type: string, format: uuid}}
        - {name: billingAccount.id, in: query, schema: {type: string, format: uuid}}
        - {name: action, in: query, schema: {type: string}}
        - {name: outcome, in: query, schema: {type: string, enum: [done, refused]}}
        - {name: operator, in: query, schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuditEntry'}
        '400': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    AppSession:
      type: apiKey
      in: cookie
      name: bss_session
      description: Session writes also require X-Bss-Request with value '1'.
    ServiceCredential:
      type: apiKey
      in: header
      name: X-Bss-Service
      description: MCP or read-only smoke credential; cannot access session or users endpoints.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    SignIn:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, maxLength: 1024, writeOnly: true}
    CredentialCheck:
      type: object
      additionalProperties: false
      required: [username, role, credentialVersion]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9._@-]{1,64}$'}
        role: {type: string, enum: [mcp]}
        credentialVersion: {type: integer, minimum: 1}
    ChangePassword:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, maxLength: 1024, writeOnly: true}
        newPassword: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
    CreateUser:
      type: object
      additionalProperties: false
      required: [username, role, password]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9._@-]{1,64}$'}
        role: {type: string, enum: [admin, user, mcp]}
        password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
    EditUser:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: {type: string, enum: [admin, user, mcp]}
        disabled: {type: boolean}
        password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
    Session:
      type: object
      additionalProperties: false
      required: [username, role, mustChangePassword]
      properties:
        username: {type: string}
        role: {type: string, enum: [admin, user]}
        mustChangePassword: {type: boolean}
    User:
      type: object
      additionalProperties: false
      required: [username, role, disabled, mustChangePassword, createdAt, updatedAt, lastLoginAt]
      properties:
        username: {type: string}
        role: {type: string, enum: [admin, user, mcp]}
        disabled: {type: boolean}
        mustChangePassword: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastLoginAt: {type: string, format: date-time, nullable: true}
    BusinessDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
    SubscriberRow:
      type: object
      additionalProperties: false
      required: [id, name, state, ratingType, customer, currency, balance, creditLimit, cycleDay,
                 financialAccount, activeProducts, customerAccounts]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        state: {type: string, enum: [Active, Suspended, Closed]}
        ratingType: {type: string, enum: [prepaid, postpaid]}
        customer:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        balance: {$ref: '#/components/schemas/Money'}
        creditLimit: {$ref: '#/components/schemas/NullableMoney'}
        cycleDay: {type: integer, minimum: 1, maximum: 28}
        financialAccount:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, name]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        activeProducts: {type: integer, minimum: 0}
        customerAccounts: {type: integer, minimum: 1}
    PartyRow:
      type: object
      additionalProperties: false
      required: [id, kind, name, status, customers, billingAccounts, ownsAccounts]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [Individual, Organization]}
        name: {type: string}
        status: {type: string, nullable: true}
        customers:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        billingAccounts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, customerId]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              customerId: {type: string, format: uuid}
        ownsAccounts:
          type: boolean
          description: It owns a financial, party or settlement account.
    PartyCustomerRow:
      type: object
      additionalProperties: false
      required: [id, name, status, party, billingAccounts]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [Created, Active, Inactive]}
        party:
          type: object
          additionalProperties: false
          required: [id, kind, name]
          properties:
            id: {type: string, format: uuid}
            kind: {type: string, enum: [Individual, Organization]}
            name: {type: string}
        billingAccounts:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
    NamedRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Money:
      type: object
      additionalProperties: false
      required: [unit, value]
      properties:
        unit: {type: string, pattern: '^[A-Z]{3}$'}
        value: {type: number, description: 'Exact, at most 2 decimals (checked in tests)'}
    NullableMoney:
      description: >-
        Money or null. (OAS 3.0 cannot make a $ref nullable; nullable next to allOf does
        not admit null, so the nullable variants are spelled out.)
      type: object
      nullable: true
      additionalProperties: false
      required: [unit, value]
      properties:
        unit: {type: string, pattern: '^[A-Z]{3}$'}
        value: {type: number}
    NullableBusinessDate:
      type: string
      nullable: true
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
    NullableLink:
      type: object
      nullable: true
      additionalProperties: false
      required: [id, href]
      properties:
        id: {type: string, format: uuid}
        href: {type: string}
    DateRange:
      description: Half-open [start, end).
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: {$ref: '#/components/schemas/BusinessDate'}
        end: {$ref: '#/components/schemas/BusinessDate'}
    Link:
      type: object
      additionalProperties: false
      required: [id, href]
      properties:
        id: {type: string, format: uuid}
        href: {type: string}
    Named:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    NullableNamed:
      description: Named or null (an offering's specification, when it has one).
      type: object
      nullable: true
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Error:
      description: The TMF630 Error body, as on the TMF surface.
      type: object
      additionalProperties: false
      required: ['@type', code, reason]  # as TMF630; the app always sends all five
      properties:
        '@type': {type: string, enum: [Error]}
        code: {type: string}
        reason: {type: string}
        message: {type: string}
        status: {type: string}
    PriceChangeRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, validFrom]
      properties:
        amount: {type: number, minimum: 0, description: 'Exact, at most 2 decimals'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        validFrom:
          description: Business date; must be tomorrow (BILLING_TZ) or later.
          allOf: [{$ref: '#/components/schemas/BusinessDate'}]
    PriceChange:
      type: object
      additionalProperties: false
      required: [productOffering, endedPrice, newPrice]
      properties:
        productOffering: {$ref: '#/components/schemas/Link'}
        endedPrice:
          type: object
          additionalProperties: false
          required: [id, href, endsOn]
          properties:
            id: {type: string, format: uuid}
            href: {type: string}
            endsOn:
              description: The first day the old price no longer prices (its exclusive end).
              allOf: [{$ref: '#/components/schemas/BusinessDate'}]
        newPrice:
          type: object
          additionalProperties: false
          required: [id, href, price, validFrom]
          properties:
            id: {type: string, format: uuid}
            href: {type: string}
            price: {$ref: '#/components/schemas/Money'}
            validFrom: {$ref: '#/components/schemas/BusinessDate'}
    Context:
      type: object
      additionalProperties: false
      required: [businessDate, now, timeZone, utcOffset, environment, operator, currency, billingRunAt,
                 paymentTermDays]
      properties:
        businessDate: {$ref: '#/components/schemas/BusinessDate'}
        now: {type: string, format: date-time}
        timeZone: {type: string, description: IANA name of BILLING_TZ}
        utcOffset: {type: string, pattern: '^[+-]\d{2}:\d{2}$'}
        environment: {type: string, description: APP_ENV}
        operator:
          type: string
          nullable: true
          description: >-
            The basic-auth user, from the X-Remote-User header the shared Caddy sets
            (overwrites). Null without it (locally).
        currency: {type: string, pattern: '^[A-Z]{3}$', description: The UI currency}
        billingRunAt:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: Local time (BILLING_TZ) of the daily billing run.
        paymentTermDays:
          type: integer
          minimum: 1
          maximum: 365
          description: >-
            BILL_PAYMENT_TERM_DAYS - days from a bill's date to its paymentDueDate for bills
            written from now on.
    CountAmount:
      type: object
      additionalProperties: false
      required: [count, amount]
      properties:
        count: {type: integer, minimum: 0}
        amount: {$ref: '#/components/schemas/Money'}
    AccountSettlement:
      type: object
      additionalProperties: false
      required: [outstanding, unallocatedCredit, overdue, onHold, paymentTermDays]
      properties:
        outstanding: {$ref: '#/components/schemas/Money'}
        unallocatedCredit: {$ref: '#/components/schemas/Money'}
        overdue: {$ref: '#/components/schemas/CountAmount'}
        onHold: {$ref: '#/components/schemas/CountAmount'}
        paymentTermDays: {type: integer, minimum: 1, maximum: 365}
    BillState:
      type: string
      enum: [new, onHold, validated, sent, settled, partiallyPaid]
    BillDetail:
      type: object
      additionalProperties: false
      required: [id, href, billNo, billingAccount, billDate, period, paymentDueDate, amountDue,
                 remainingAmount, state, category, overdue, allowedStates, charges, sources,
                 history]
      properties:
        id: {type: string, format: uuid}
        href: {type: string}
        billNo: {type: string, pattern: '^BL-[0-9A-F]{8}$'}
        billingAccount: {$ref: '#/components/schemas/Link'}
        billDate: {$ref: '#/components/schemas/BusinessDate'}
        period: {$ref: '#/components/schemas/DateRange'}
        paymentDueDate: {$ref: '#/components/schemas/BusinessDate'}
        amountDue:
          description: May be negative (a credit note).
          allOf: [{$ref: '#/components/schemas/Money'}]
        remainingAmount: {$ref: '#/components/schemas/Money'}
        state: {$ref: '#/components/schemas/BillState'}
        category: {type: string, enum: [normal, creditNote]}
        overdue:
          type: boolean
          description: Due before the business date with something remaining. Display only.
        allowedStates:
          description: >-
            What PATCH /customerBill/{id} accepts now besides the current state: [onHold]
            for sent or partiallyPaid, the state the allocations imply for onHold, else none.
          type: array
          items: {$ref: '#/components/schemas/BillState'}
        charges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, href, kind, period, amount, product, productOffering]
            properties:
              id: {type: string, format: uuid}
              href: {type: string}
              kind: {type: string, enum: [charge, refund]}
              period: {$ref: '#/components/schemas/DateRange'}
              amount: {$ref: '#/components/schemas/Money'}
              product: {$ref: '#/components/schemas/NullableLink'}
              productOffering: {$ref: '#/components/schemas/NullableNamed'}
        sources:
          description: What paid the bill, in the order it was applied.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, id, href, label, amount, allocation, allocatedAt]
            properties:
              kind: {type: string, enum: [payment, creditNote]}
              id: {type: string, format: uuid}
              href: {type: string}
              label:
                type: string
                description: The payment method of a payment, the bill number of a credit note.
              amount: {$ref: '#/components/schemas/Money'}
              allocation: {type: string, enum: [automatic, explicit]}
              allocatedAt: {type: string, format: date-time}
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fromState, toState, changedAt, cause, operator]
            properties:
              fromState:
                type: string
                nullable: true
                enum: [new, onHold, validated, sent, settled, partiallyPaid, null]
              toState: {$ref: '#/components/schemas/BillState'}
              changedAt: {type: string, format: date-time}
              cause: {type: string, enum: [run, payment, operator]}
              operator: {type: string, nullable: true}
    FirstCharge:
      type: object
      additionalProperties: false
      required: [billingAccount, productOffering, startDate, period, cyclePeriod, billableDays,
                 periodDays, prorated, price, amount, chargeRunDate, billDate, next, balance,
                 balanceAfter, creditLimit, exceedsCreditLimit]
      properties:
        billingAccount:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: {type: string, format: uuid}
        productOffering: {$ref: '#/components/schemas/Named'}
        startDate: {$ref: '#/components/schemas/BusinessDate'}
        period: {$ref: '#/components/schemas/DateRange'}
        cyclePeriod: {$ref: '#/components/schemas/DateRange'}
        billableDays: {type: integer, minimum: 1}
        periodDays: {type: integer, minimum: 1}
        prorated: {type: boolean}
        price:
          description: The full charge interval price before tax.
          allOf: [{$ref: '#/components/schemas/Money'}]
        amount:
          description: The first charge with its taxes (the account's exemptions applied).
          allOf: [{$ref: '#/components/schemas/Money'}]
        recurringChargePeriod: {type: string, description: 'Charge interval label; absent means month.'}
        chargeRunDate: {$ref: '#/components/schemas/BusinessDate'}
        billDate: {$ref: '#/components/schemas/BusinessDate'}
        next:
          description: The first full period after it; null if no price covers it.
          type: object
          nullable: true
          additionalProperties: false
          required: [start, amount]
          properties:
            start: {$ref: '#/components/schemas/BusinessDate'}
            amount: {$ref: '#/components/schemas/Money'}
        balance: {$ref: '#/components/schemas/Money'}
        balanceAfter: {$ref: '#/components/schemas/Money'}
        creditLimit: {$ref: '#/components/schemas/NullableMoney'}
        exceedsCreditLimit:
          type: boolean
          description: >-
            balanceAfter < -creditLimit. Informational; ordering never checks it. On a
            prepaid account: the first interval is not fully covered (shortfall > 0).
        required:
          description: Prepaid accounts only. The first interval with its taxes, to be held.
          allOf: [{$ref: '#/components/schemas/Money'}]
        available:
          description: Prepaid accounts only. Spendable funds now (ledger minus holds, never below zero).
          allOf: [{$ref: '#/components/schemas/Money'}]
        shortfall:
          description: Prepaid accounts only. What is missing to start the purchase now; zero when covered.
          allOf: [{$ref: '#/components/schemas/Money'}]
        credit:
          description: >-
            Prepaid accounts, when product.id is given. What the change credits for the unused
            dates of the product's paid interval, tax included; not counted on to fund the
            new interval.
          allOf: [{$ref: '#/components/schemas/Money'}]
        fees:
          description: >-
            Prepaid accounts only; absent without fees. The one-time fees charged with the
            purchase (a `oneTime` price valid on the start date), taxed like any charge and
            included in `required` and `amount`. An add-on or pay-as-you-go offering has no
            recurring price: its quote is these fees alone, with price zero and a one-day period.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, amount, tax, gross]
            properties:
              name: {type: string}
              amount: {allOf: [{$ref: '#/components/schemas/Money'}], description: Before tax.}
              tax: {$ref: '#/components/schemas/Money'}
              gross: {allOf: [{$ref: '#/components/schemas/Money'}], description: Tax included.}
    LifecycleSettings:
      type: object
      additionalProperties: false
      required: [graceDays, suspensionDays, numberAgingDays, paygZeroBalanceDays, updatedAt]
      properties:
        graceDays: {type: integer, minimum: 0, maximum: 365}
        suspensionDays: {type: integer, minimum: 0, maximum: 3650}
        numberAgingDays: {type: integer, minimum: 0, maximum: 3650}
        paygZeroBalanceDays: {type: integer, minimum: 0, maximum: 365}
        updatedAt: {type: string, format: date-time, nullable: true}
    LogSettings:
      type: object
      additionalProperties: false
      required: [baseLevel, envLevel, effectiveLevel, debugUntil, updatedAt, updatedBy]
      properties:
        baseLevel: {type: string, enum: [WARNING, INFO, null], nullable: true}
        envLevel: {type: string}
        effectiveLevel: {type: string}
        debugUntil: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
        updatedBy: {type: string, nullable: true}
    ServiceLogLevel:
      type: object
      additionalProperties: false
      required: [baseLevel, effectiveLevel, debugUntil]
      properties:
        baseLevel: {type: string, enum: [WARNING, INFO, null], nullable: true}
        effectiveLevel: {type: string}
        debugUntil: {type: string, format: date-time, nullable: true}
    AccountProduct:
      type: object
      additionalProperties: false
      required: [id, href, status, startDate, terminationDate, productOffering,
                 productSpecification, price, nextChargeDate, pendingChanges]
      properties:
        recurringChargePeriod: {type: string, description: 'Charge interval label; absent means month.'}
        id: {type: string, format: uuid}
        href: {type: string}
        status:
          type: string
          enum: [created, pendingActive, active, pendingTerminate, suspended, terminated]
        startDate: {$ref: '#/components/schemas/BusinessDate'}
        terminationDate:
          description: Exclusive - the first day not billed.
          allOf: [{$ref: '#/components/schemas/NullableBusinessDate'}]
        productOffering:
          type: object
          additionalProperties: false
          required: [id, name, code]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
            code: {type: string, nullable: true}
        productSpecification: {$ref: '#/components/schemas/NullableNamed'}
        price: {$ref: '#/components/schemas/NullableMoney'}
        authorizedAt: {type: string, format: date-time, nullable: true}
        paidThrough: {$ref: '#/components/schemas/NullableBusinessDate'}
        suspensionCause: {type: string, nullable: true, enum: [manual, account, funding, lifecycle, null]}
        needs_topup:
          type: object
          nullable: true
          additionalProperties: false
          required: [required, available, shortfall, observedAt]
          properties:
            required: {type: number}
            available: {type: number}
            shortfall: {type: number}
            observedAt: {type: string, format: date-time}
        nextChargeDate:
          description: First future run that will write a recurring charge; prepaid renewal is its paid-through date.
          allOf:
            - {$ref: '#/components/schemas/NullableBusinessDate'}
        undoableStatusChange:
          description: Applied status change today whose order can still be cancelled.
          type: object
          nullable: true
          additionalProperties: false
          required: [date, status, productOrder]
          properties:
            date: {$ref: '#/components/schemas/BusinessDate'}
            status: {type: string, enum: [suspended, active]}
            productOrder:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: {type: string, format: uuid}
        pendingChanges:
          description: >-
            Status and offering changes not yet in effect, by date; [] when there is none.
            Undo one by cancelling its productOrder.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, date, productOrder]
            properties:
              kind: {type: string, enum: [status, offering]}
              date: {$ref: '#/components/schemas/BusinessDate'}
              status: {type: string, enum: [suspended, active], nullable: true}
              productOffering: {$ref: '#/components/schemas/NullableNamed'}
              productOrder: {$ref: '#/components/schemas/Link'}
        offeringKind:
          description: Prepaid accounts only. plan, addOn (a pack bought for a plan's period) or payAsYouGo.
          type: string
          enum: [plan, addOn, payAsYouGo]
        parentProduct:
          description: Prepaid accounts only. An add-on's plan product; null otherwise.
          allOf: [{$ref: '#/components/schemas/NullableLink'}]
        fundingSource:
          description: >-
            Prepaid accounts only. How a renewal is paid: the balance, or the balance and then
            the default card for the shortfall (auto-pay on and a default card saved).
          type: string
          enum: [balance, balanceThenCard]
        lifecycle:
          description: >-
            Prepaid plans and pay-as-you-go lines (null for an operator-suspended line, which
            the lifecycle leaves alone). `grace`: unfunded, service still on; `suspended`:
            suspended on the network by the lifecycle. `nextTransition` is the next one not
            yet taken, derived from the settings (null while funded).
          type: object
          nullable: true
          additionalProperties: false
          required: [state, nextTransition]
          properties:
            state: {type: string, enum: [active, grace, suspended]}
            nextTransition:
              type: object
              nullable: true
              additionalProperties: false
              required: [action, date]
              properties:
                action: {type: string, enum: [suspend, deactivate]}
                date: {$ref: '#/components/schemas/BusinessDate'}
        renewalHistory:
          description: Prepaid accounts only. The product's funded intervals, newest first.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [authorizedAt, period, kind, amount, tax, fundedBy, bill]
            properties:
              authorizedAt: {type: string, format: date-time}
              period:
                type: object
                additionalProperties: false
                required: [start, end]
                properties:
                  start: {$ref: '#/components/schemas/BusinessDate'}
                  end: {$ref: '#/components/schemas/BusinessDate'}
              kind: {type: string, enum: [purchase, renewal, offeringChange]}
              amount: {allOf: [{$ref: '#/components/schemas/Money'}], description: Tax included.}
              tax: {$ref: '#/components/schemas/Money'}
              fundedBy: {type: string, enum: [balance, card]}
              bill: {$ref: '#/components/schemas/NullableLink'}
    Charge:
      type: object
      additionalProperties: false
      required: [id, href, kind, runDate, period, billableDays, periodDays, prorated, amount,
                 product, productOffering, bill]
      properties:
        id: {type: string, format: uuid}
        href: {type: string}
        kind: {type: string, enum: [charge, refund]}
        runDate: {$ref: '#/components/schemas/BusinessDate'}
        period: {$ref: '#/components/schemas/DateRange'}
        billableDays: {type: integer, minimum: 1}
        periodDays: {type: integer, minimum: 1}
        prorated: {type: boolean}
        amount:
          description: With its taxes (the ABR's taxIncludedAmount) - a refund is negative.
          allOf: [{$ref: '#/components/schemas/Money'}]
        product: {$ref: '#/components/schemas/NullableLink'}  # null: a transfer fee
        productOffering: {$ref: '#/components/schemas/NullableNamed'}  # null: a transfer fee
        bill: {$ref: '#/components/schemas/NullableLink'}
    Transaction:
      type: object
      additionalProperties: false
      required: [id, href, type, date, note, period, amount, balanceAfter]
      properties:
        id: {type: string, format: uuid}
        href: {type: string}
        type: {type: string, enum: [charge, refund, payment, payout, adjustment, reversal, transferIn, transferOut]}
        date:
          description: A charge's or refund's billing run date; a payment's date.
          allOf: [{$ref: '#/components/schemas/BusinessDate'}]
        note:
          type: string
          description: The offering name for a charge or refund; the payment method for a payment; the reason (else "Adjustment") for an adjustment; "Cancelled top-up" or "Cancelled adjustment" for a reversal; "From {account}" or "To {account}" for a transfer.
        period:
          description: Null for a payment.
          type: object
          nullable: true
          additionalProperties: false
          required: [start, end]
          properties:
            start: {$ref: '#/components/schemas/BusinessDate'}
            end: {$ref: '#/components/schemas/BusinessDate'}
        amount:
          description: Positive = credit to the customer.
          allOf: [{$ref: '#/components/schemas/Money'}]
        balanceAfter: {$ref: '#/components/schemas/Money'}
    NullableDateTime:
      type: string
      nullable: true
      format: date-time
    RunRef:
      type: object
      additionalProperties: false
      required: [id, runDate]
      properties:
        id: {type: string, format: uuid}
        runDate: {$ref: '#/components/schemas/BusinessDate'}
    NullableRunRef:
      type: object
      nullable: true
      additionalProperties: false
      required: [id, runDate]
      properties:
        id: {type: string, format: uuid}
        runDate: {$ref: '#/components/schemas/BusinessDate'}
    BillingRun:
      type: object
      additionalProperties: false
      required: [id, runDate, status, failureKind, trigger, attempt, startedAt, finishedAt,
                 heartbeatAt, accounts, charges, error, isLatest]
      properties:
        id: {type: string, format: uuid}
        runDate: {$ref: '#/components/schemas/BusinessDate'}
        status: {type: string, enum: [running, completed, failed]}
        failureKind:
          description: >-
            Set exactly when failed - accounts (some failed or are blocked; later dates go
            ahead) or run (the run itself failed; no later date until it succeeds).
          type: string
          nullable: true
          enum: [accounts, run, null]
        trigger: {type: string, enum: [scheduled, catchUp, retry]}
        attempt: {type: integer, minimum: 1}
        startedAt: {type: string, format: date-time}
        finishedAt: {$ref: '#/components/schemas/NullableDateTime'}
        heartbeatAt: {$ref: '#/components/schemas/NullableDateTime'}
        accounts:
          type: object
          additionalProperties: false
          required: [total, ok, failed, blocked]
          properties:
            total: {type: integer, minimum: 0, description: Accounts opened before 00:00 of the run date}
            ok: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            blocked: {type: integer, minimum: 0}
        charges:
          type: object
          additionalProperties: false
          required: [count, amounts]
          properties:
            count: {type: integer, minimum: 0}
            amounts:
              description: The sum per currency (refunds negative).
              type: array
              items: {$ref: '#/components/schemas/Money'}
        error: {type: string, nullable: true}
        isLatest: {type: boolean}
    RunAccount:
      type: object
      additionalProperties: false
      required: [billingAccount, status, error, waitsFor, attempts, finishedAt]
      properties:
        billingAccount: {$ref: '#/components/schemas/Named'}
        status: {type: string, enum: [ok, failed, blocked]}
        error: {type: string, nullable: true, description: Set exactly when failed}
        waitsFor:
          description: The earlier failed run a blocked account waits for; null otherwise.
          allOf: [{$ref: '#/components/schemas/NullableRunRef'}]
        attempts: {type: integer, minimum: 1}
        finishedAt: {type: string, format: date-time}
    WorkerRequest:
      type: object
      additionalProperties: false
      required: [id, kind, upTo, run, requestedAt, requestedBy, pickedAt, doneAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [catchUp, retry]}
        upTo: {$ref: '#/components/schemas/NullableBusinessDate'}
        run: {$ref: '#/components/schemas/NullableRunRef'}
        requestedAt: {type: string, format: date-time}
        requestedBy:
          type: string
          nullable: true
          description: The operator (X-Remote-User); display-only.
        pickedAt: {$ref: '#/components/schemas/NullableDateTime'}
        doneAt: {$ref: '#/components/schemas/NullableDateTime'}
    CatchUpRequest:
      type: object
      additionalProperties: false
      required: [upTo]
      properties:
        upTo: {$ref: '#/components/schemas/BusinessDate'}
    CatchUp:
      type: object
      additionalProperties: false
      required: [dates]
      properties:
        request: {$ref: '#/components/schemas/WorkerRequest'}
        dates:
          description: The run dates the request will run, in order; empty when nothing is due.
          type: array
          items: {$ref: '#/components/schemas/BusinessDate'}
    RetryQueued:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request: {$ref: '#/components/schemas/WorkerRequest'}
    EventSubscription:
      type: object
      additionalProperties: false
      required: [id, api, hub, callback, query, eventTypes, subscribedAt, lastDelivery, failures]
      properties:
        id: {type: string, format: uuid}
        api:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: {type: string, pattern: '^TMF[0-9]{3}$'}
            name: {type: string}
        hub:
          type: string
          description: The API's /hub/{id} path, the one DELETE uses.
        callback: {type: string}
        query:
          type: string
          nullable: true
          description: As sent (eventType=A,B); null means every event of the API.
        eventTypes:
          type: array
          description: Empty means every event of the API.
          items: {type: string}
        subscribedAt: {type: string, format: date-time}
        lastDelivery:
          type: object
          nullable: true
          additionalProperties: false
          required: [state, at]
          properties:
            state: {type: string, enum: [pending, delivered, failed, dropped]}
            at: {type: string, format: date-time}
        failures: {type: integer, minimum: 0}
    SimBatch:
      type: object
      additionalProperties: false
      required: [name, simType, source, createdAt, total, counts]
      properties:
        name: {type: string}
        simType: {type: string, enum: [physical, esim]}
        source: {type: string, enum: [import, generated]}
        createdAt: {type: string, format: date-time}
        total: {type: integer, minimum: 0}
        counts:
          type: object
          additionalProperties: false
          required: [in_stock, reserved, active, retired]
          properties:
            in_stock: {type: integer, minimum: 0}
            reserved: {type: integer, minimum: 0}
            active: {type: integer, minimum: 0}
            retired: {type: integer, minimum: 0}
    NumberPool:
      type: object
      additionalProperties: false
      required: [areaCode, requested, numbers]
      properties:
        areaCode: {type: string}
        requested: {type: integer, minimum: 1}
        numbers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, value, href]
            properties:
              id: {type: string, format: uuid}
              value: {type: string}
              href: {type: string}
    NotificationConsent:
      type: object
      additionalProperties: false
      required: [customer, marketing, history]
      properties:
        customer:
          type: object
          additionalProperties: false
          required: [id, href]
          properties:
            id: {type: string, format: uuid}
            href: {type: string}
        marketing:
          type: object
          additionalProperties: false
          required: [sms, email]
          properties:
            sms: &consentOrNull
              nullable: true
              type: object
              additionalProperties: false
              required: [id, channel, category, optedIn, source, recordedBy, recordedAt]
              properties:
                id: {type: string, format: uuid}
                channel: {type: string, enum: [sms, email]}
                category: {type: string, enum: [marketing]}
                optedIn: {type: boolean}
                source: {type: string}
                recordedBy: {type: string}
                recordedAt: {type: string, format: date-time}
            email: *consentOrNull
        history:
          type: array
          items: {$ref: '#/components/schemas/ConsentEntry'}
    ConsentEntry:
      type: object
      additionalProperties: false
      required: [id, channel, category, optedIn, source, recordedBy, recordedAt]
      properties:
        id: {type: string, format: uuid}
        channel: {type: string, enum: [sms, email]}
        category: {type: string, enum: [marketing]}
        optedIn: {type: boolean}
        source: {type: string}
        recordedBy: {type: string}
        recordedAt: {type: string, format: date-time}
    ResentMessage:
      description: The queued copy, as TMF681 shows a CommunicationMessage.
      type: object
      required: [id, href, state, messageType, content, characteristic]
      properties:
        id: {type: string, format: uuid}
        href: {type: string}
        state: {type: string, enum: [initial, inProgress, completed, cancelled, failed]}
        messageType: {type: string, enum: [SMS, Email]}
        content: {type: string}
        characteristic: {type: array, items: {type: object}}
    AccountPin:
      type: object
      additionalProperties: false
      required: [customer, set, setAt, setBy, reason, failedAttempts, lockedUntil]
      properties:
        customer: &customerRef
          type: object
          additionalProperties: false
          required: [id, href]
          properties:
            id: {type: string, format: uuid}
            href: {type: string}
        set: {type: boolean}
        setAt: {type: string, format: date-time, nullable: true}
        setBy: {type: string, nullable: true}
        reason: {type: string, nullable: true}
        failedAttempts: {type: integer, minimum: 0}
        lockedUntil: {type: string, format: date-time, nullable: true}
    LineLock:
      type: object
      additionalProperties: false
      required: [product, simSwap, portOut, updatedAt, updatedBy, reason]
      properties:
        product: *customerRef
        simSwap: {type: boolean}
        portOut: {type: boolean}
        updatedAt: {type: string, format: date-time, nullable: true}
        updatedBy: {type: string, nullable: true}
        reason: {type: string, nullable: true}
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, at, operator, role, customer, billingAccount, product, action, outcome, reason, verification, detail]
      properties:
        id: {type: string, format: uuid}
        at: {type: string, format: date-time}
        operator: {type: string}
        role: {type: string, nullable: true}
        customer: &optionalRef
          nullable: true
          type: object
          additionalProperties: false
          required: [id, href]
          properties:
            id: {type: string, format: uuid}
            href: {type: string}
        billingAccount: *optionalRef
        product: *optionalRef
        action:
          type: string
          enum: [sim_swap, number_change, number_transfer_pin, contact_change, port_out, pin_set, pin_reset, lock_set, lock_cleared, pin_lockout]
        outcome: {type: string, enum: [done, refused]}
        reason: {type: string, nullable: true}
        verification: {type: string, enum: [pin, notRequired, none]}
        detail: {type: object}
    KpiReport:
      type: object
      additionalProperties: false
      required: [currency, businessDate, from, to, months]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        businessDate: {type: string, format: date}
        from: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
        to: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
        months:
          type: array
          description: Oldest first.
          items: {$ref: '#/components/schemas/KpiMonth'}
    KpiMonth:
      type: object
      additionalProperties: false
      required: [month, firstDay, lastDay, complete, subscribers, churnRate, revenue, arpu]
      properties:
        month: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
        firstDay: {type: string, format: date}
        lastDay: {type: string, format: date, description: "The month's last day, or the business date for the current month."}
        complete: {type: boolean, description: 'False for the current month (it runs to the business date).'}
        subscribers:
          type: object
          additionalProperties: false
          required: [opening, grossAdds, disconnects, netAdds, closing, average]
          description: Lines live on the day before the month (opening) and on its last day (closing); closing = opening + netAdds.
          properties:
            opening: {type: integer, minimum: 0}
            grossAdds: {type: integer, minimum: 0, description: Lines whose start date is in the month.}
            disconnects: {type: integer, minimum: 0, description: 'Lines whose termination date is in the month (deactivation, termination, port-out).'}
            netAdds: {type: integer}
            closing: {type: integer, minimum: 0}
            average: {type: number, minimum: 0, description: '(opening + closing) / 2.'}
        churnRate:
          type: number
          nullable: true
          description: disconnects / opening x 100, 2 decimals half-even; null when opening is 0.
        revenue:
          type: object
          additionalProperties: false
          required: [total, plans, addOns, usage, fees]
          description: >-
            Tax-excluded ABR amounts by the run date of their billing run (billed, not deferred,
            revenue). plans = recurring charges less their refunds; addOns = one-time fees of
            add-on products; usage = rated pay-as-you-go usage; fees = every other one-time fee.
          properties:
            total: {$ref: '#/components/schemas/Money'}
            plans: {$ref: '#/components/schemas/Money'}
            addOns: {$ref: '#/components/schemas/Money'}
            usage: {$ref: '#/components/schemas/Money'}
            fees: {$ref: '#/components/schemas/Money'}
        arpu:
          $ref: '#/components/schemas/NullableMoney'
    UsageSummary:
      type: object
      additionalProperties: false
      required: [product, date, period, allowances, throttled, payAsYouGo]
      properties:
        product:
          type: object
          additionalProperties: false
          required: [id, href]
          properties:
            id: {type: string, format: uuid}
            href: {type: string}
        date: {type: string, format: date}
        period:
          nullable: true
          type: object
          additionalProperties: false
          required: [startDate, endDate]
          properties:
            startDate: {type: string, format: date}
            endDate:
              description: Exclusive (half-open).
              type: string
              format: date
        allowances:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, unit, used, included, remaining, percent, thresholds]
            properties:
              kind: {type: string, enum: [data, voice, sms]}
              unit: {type: string, enum: [bytes, seconds, messages]}
              used: {type: integer, minimum: 0}
              included: {type: integer, minimum: 0, description: 0 means nothing included.}
              remaining: {type: integer, minimum: 0}
              percent: {type: integer, minimum: 0, nullable: true}
              thresholds:
                type: array
                items: {type: integer, enum: [80, 100]}
        throttled:
          description: The network said so on the period's latest record, or data passed the cap.
          type: boolean
        payAsYouGo:
          description: >-
            Set for a pay-as-you-go line (issue 191), null for any other. The balance is the
            account's spendable money (ledger less holds; negative after late usage). `barred`
            is the state the balance asked of the network: `suspend` at zero or below,
            `restore` after a top-up.
          nullable: true
          type: object
          additionalProperties: false
          required: [balance, barred, barring, unratedRecords]
          properties:
            balance: {$ref: '#/components/schemas/Money'}
            barred: {type: boolean}
            barring:
              description: The line's latest barring command, null when none was ever made.
              nullable: true
              type: object
              additionalProperties: false
              required: [command, state, lastError, createdAt]
              properties:
                command: {type: string, enum: [suspend, restore]}
                state: {type: string, enum: [pending, confirmed, refused]}
                lastError: {type: string, nullable: true}
                createdAt: {type: string, format: date-time}
            unratedRecords:
              description: Records not rated yet (their day is not closed, or the line is a plan line).
              type: integer
              minimum: 0
    PortRequest:
      type: object
      additionalProperties: false
      required: [id, direction, state, number, areaCode, resource, carrierAccountNumber,
                 billingZip, firstName, lastName, carrierReference, submissions, rejectionCode,
                 rejectionReason, attempts, nextAttemptAt, lastError, product, billingAccount,
                 productOrder, answeredAt, createdAt, updatedAt, completedAt]
      properties:
        id: {type: string, format: uuid}
        direction: {type: string, enum: [in, out]}
        state:
          description: Internal state, not a TMF enum.
          type: string
          enum: [submitted, pending, rejected, completed, cancelled]
        number: {type: string, description: E.164 digits of the number being ported.}
        areaCode: {type: string, nullable: true}
        resource:
          type: object
          nullable: true
          description: The TMF639 resource; null for a port-out of a number the BSS does not hold.
        carrierAccountNumber: {type: string, nullable: true}
        billingZip: {type: string, nullable: true}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        carrierReference: {type: string, nullable: true}
        submissions: {type: integer, minimum: 1}
        rejectionCode: {type: string, nullable: true}
        rejectionReason: {type: string, nullable: true}
        attempts: {type: integer, minimum: 0}
        nextAttemptAt: {$ref: '#/components/schemas/NullableDateTime'}
        lastError: {type: string, nullable: true}
        product: {$ref: '#/components/schemas/NullableLink'}
        billingAccount: {$ref: '#/components/schemas/NullableLink'}
        productOrder: {$ref: '#/components/schemas/NullableLink'}
        answeredAt: {$ref: '#/components/schemas/NullableDateTime'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {$ref: '#/components/schemas/NullableDateTime'}
    TransferPin:
      type: object
      additionalProperties: false
      required: [id, state, number, product, createdAt, expiresAt, usedAt, revokedAt]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [active, expired, used, revoked]}
        number: {type: string}
        product: {$ref: '#/components/schemas/Link'}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        usedAt: {$ref: '#/components/schemas/NullableDateTime'}
        revokedAt: {$ref: '#/components/schemas/NullableDateTime'}
        pin:
          type: string
          description: The PIN, only in the response that creates it; never stored or listed.
    ProductDevice:
      type: object
      additionalProperties: false
      required: [id, product, imei, compatibility, reasons, checkedAt, startedAt, endedAt,
                 recordedByItem]
      properties:
        id: {type: string, format: uuid}
        product: {$ref: '#/components/schemas/Link'}
        imei: {type: string, pattern: '^[0-9]{15}$'}
        compatibility: {type: string, enum: [compatible, unknown]}
        reasons: {type: array, items: {type: string}}
        checkedAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        endedAt: {$ref: '#/components/schemas/NullableDateTime'}
        recordedByItem:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: {type: string, format: uuid}
    DeviceCheck:
      type: object
      additionalProperties: false
      required: [imei, result, reasons]
      properties:
        imei: {type: string, pattern: '^[0-9]{15}$'}
        result: {type: string, enum: [compatible, incompatible, unknown]}
        reasons: {type: array, items: {type: string}}
    NetworkCommand:
      type: object
      additionalProperties: false
      required: [id, kind, state, productOrder, productOrderItem, product, dueDate, profile,
                 request, attempts, attemptedAt, nextAttemptAt, lastError, refusalCode,
                 confirmedAt, createdAt]
      properties:
        id: {type: string, format: uuid, description: The idempotency key sent to the network.}
        kind: {type: string, enum: [activate, suspend, restore, deactivate, change_profile, swap_sim]}
        state:
          description: Internal state, not a TMF enum.
          type: string
          enum: [pending, confirmed, refused, exhausted, cancelled]
        productOrder: {$ref: '#/components/schemas/Link'}
        productOrderItem:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: {type: string, format: uuid}
        product: {$ref: '#/components/schemas/NullableLink'}
        dueDate: {$ref: '#/components/schemas/BusinessDate'}
        profile:
          type: object
          description: The offering's effective network profile at acceptance.
        request:
          type: object
          nullable: true
          description: The request as first sent (TMF641-shaped); null before the first send.
        attempts: {type: integer, minimum: 0}
        attemptedAt: {$ref: '#/components/schemas/NullableDateTime'}
        nextAttemptAt: {$ref: '#/components/schemas/NullableDateTime'}
        lastError: {type: string, nullable: true}
        refusalCode: {type: string, nullable: true}
        confirmedAt: {$ref: '#/components/schemas/NullableDateTime'}
        createdAt: {type: string, format: date-time}
    CardTopupRequest:
      type: object
      additionalProperties: false
      required: [amount, idempotencyKey]
      properties:
        amount: {$ref: '#/components/schemas/Money'}
        paymentMethod:
          type: object
          description: "A saved card of the account; default is the account's default card."
          required: [id]
          properties:
            id: {type: string, format: uuid}
        idempotencyKey: {type: string, minLength: 1, maxLength: 64}
    AutoTopupRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
        threshold: {$ref: '#/components/schemas/Money'}
        amount: {$ref: '#/components/schemas/Money'}
    AutoTopup:
      type: object
      additionalProperties: false
      required: [enabled, threshold, amount, defaultPaymentMethod, changedAt]
      properties:
        enabled: {type: boolean}
        threshold: {$ref: '#/components/schemas/NullableMoney'}
        amount: {$ref: '#/components/schemas/NullableMoney'}
        defaultPaymentMethod: {$ref: '#/components/schemas/NullableLink'}
        changedAt: {$ref: '#/components/schemas/NullableDateTime'}
    PaymentCommand:
      type: object
      additionalProperties: false
      required: [id, href, kind, purpose, state, billingAccount, paymentMethod, amount,
                 idempotencyKey, attempts, nextAttemptAt, lastError, declineReason,
                 gatewayReference, payment, topup, createdAt, sentAt, confirmedAt]
      properties:
        id: {type: string, format: uuid, description: The idempotency key sent to the gateway.}
        href: {type: string}
        kind: {type: string, enum: [charge, refund]}
        purpose: {type: string, enum: [topup, auto_topup, renewal]}
        state:
          description: Internal state, not a TMF enum.
          type: string
          enum: [pending, sent, confirmed, declined, exhausted, cancelled]
        billingAccount: {$ref: '#/components/schemas/Link'}
        paymentMethod: {$ref: '#/components/schemas/Link'}
        amount: {$ref: '#/components/schemas/Money'}
        idempotencyKey: {type: string, nullable: true, description: "The caller's key; null for an automatic top-up."}
        attempts: {type: integer, minimum: 0}
        nextAttemptAt: {$ref: '#/components/schemas/NullableDateTime'}
        lastError: {type: string, nullable: true}
        declineReason: {type: string, nullable: true}
        gatewayReference: {type: string, nullable: true}
        payment: {$ref: '#/components/schemas/NullableLink'}
        topup: {$ref: '#/components/schemas/NullableLink'}
        createdAt: {type: string, format: date-time}
        sentAt: {$ref: '#/components/schemas/NullableDateTime'}
        confirmedAt: {$ref: '#/components/schemas/NullableDateTime'}
    PrepaidCommand:
      type: object
      additionalProperties: false
      required: [id, kind, state, billingAccount, dueDate, createdAt, attempts, attemptedAt,
                 nextRetryAt, outcome, reason, error, needs_topup, productOrder, products,
                 billingRun, bills]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [order, renewal, transfer]}
        state:
          description: Internal recovery state, not a TMF enum.
          type: string
          enum: [pending, completed, failedTechnical]
        billingAccount: {$ref: '#/components/schemas/Named'}
        dueDate: {$ref: '#/components/schemas/BusinessDate'}
        createdAt: {type: string, format: date-time}
        attempts:
          type: integer
          minimum: 0
          description: Committed success or technical-failure decisions; kept across retries.
        attemptedAt: {$ref: '#/components/schemas/NullableDateTime'}
        nextRetryAt:
          description: Automatic technical retry eligibility; set only when failedTechnical.
          allOf: [{$ref: '#/components/schemas/NullableDateTime'}]
        outcome:
          type: string
          nullable: true
          description: The completed result's outcome (funded, terminated, cancelled).
        reason: {type: string, nullable: true, description: The completed result's reason}
        error: {type: string, nullable: true, description: Last technical failure}
        needs_topup:
          description: The latest funding shortfall, only while pending.
          type: object
          nullable: true
          additionalProperties: false
          required: [required, available, shortfall, observedAt]
          properties:
            required: {type: number}
            available: {type: number}
            shortfall: {type: number}
            observedAt: {type: string, format: date-time}
        productOrder: {$ref: '#/components/schemas/NullableLink'}
        products:
          type: array
          items: {$ref: '#/components/schemas/Link'}
        billingRun: {$ref: '#/components/schemas/NullableRunRef'}
        bills:
          description: Bills and credit notes posted by the command's run.
          type: array
          items: {$ref: '#/components/schemas/Link'}
